<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c4cf0"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#141a3c" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#grad)"/>
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Barbell handle -->
    <rect x="180" y="240" width="152" height="32" rx="10"/>
    <!-- Inner weights -->
    <rect x="144" y="160" width="32" height="192" rx="12"/>
    <rect x="336" y="160" width="32" height="192" rx="12"/>
    <!-- Outer weights -->
    <rect x="110" y="196" width="26" height="120" rx="8" opacity="0.92"/>
    <rect x="376" y="196" width="26" height="120" rx="8" opacity="0.92"/>
  </g>
</svg>
