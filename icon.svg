<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141b"/>
      <stop offset="55%" stop-color="#09090d"/>
      <stop offset="100%" stop-color="#1f080c"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#e11d48" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="105" fill="none" stroke="url(#redGrad)" stroke-width="6" stroke-opacity="0.45"/>
  <g filter="url(#shadow)">
    <!-- Barbell handle -->
    <rect x="180" y="240" width="152" height="32" rx="10" fill="#f8fafc"/>
    <!-- Inner weights -->
    <rect x="142" y="156" width="34" height="200" rx="12" fill="url(#redGrad)"/>
    <rect x="336" y="156" width="34" height="200" rx="12" fill="url(#redGrad)"/>
    <!-- Outer weights -->
    <rect x="106" y="194" width="28" height="124" rx="9" fill="#f8fafc" opacity="0.95"/>
    <rect x="378" y="194" width="28" height="124" rx="9" fill="#f8fafc" opacity="0.95"/>
  </g>
</svg>
