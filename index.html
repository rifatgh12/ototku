<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OtotKu — Tracker Makan & Latihan Gym</title>
<meta name="description" content="Pantau protein, kalori, lemak jenuh, biaya makan, dan progres latihan dumbbell 4 hari per minggu dengan sinkronisasi cloud Supabase/Firebase.">
<meta name="theme-color" content="#07070a">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OtotKu">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Offline QR Code Generator -->
<script src="qrcode.min.js" defer></script>
<!-- Chart.js dari cdnjs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<!-- Supabase Client CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<!-- Firebase Compat SDK CDN -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js" defer></script>

<style>
/* =========================================================
   1. DESIGN TOKENS — CRIMSON & OBSIDIAN PREMIUM EDITION
   ========================================================= */
:root{
  --bg:#f6f5f7; --surface:rgba(255,255,255,.92); --solid:#ffffff; --soft:#efedf2; --soft-2:#e5e2ea; --border:#e2dfe8;
  --border-accent:rgba(220,38,38,.32);
  --text:#0e0e12; --muted:#686674;
  --primary:#dc2626; --primary-bright:#e11d48; --primary-2:#ea580c; --primary-soft:rgba(220,38,38,.11);
  --ok:#059669; --ok-soft:rgba(16,185,129,.13);
  --warn:#d97706; --warn-soft:rgba(245,158,11,.15);
  --bad:#dc2626; --bad-soft:rgba(220,38,38,.12);
  --glow-1:rgba(220,38,38,.13); --glow-2:rgba(15,15,20,.05);
  --shadow:0 1px 3px rgba(14,14,18,.06),0 14px 34px -12px rgba(14,14,18,.12),inset 0 1px 0 rgba(255,255,255,.8);
  --radius:20px; --tab-h:68px;
  --grad:linear-gradient(135deg,#f43f5e 0%,#dc2626 52%,#991b1b 100%);
  --grad-hero:linear-gradient(135deg,#0f0709 0%,#22080d 42%,#7f1d1d 84%,#dc2626 100%);
  color-scheme:light;
  accent-color:var(--primary);
  scrollbar-color:var(--primary) var(--soft);
}
[data-theme="dark"]{
  --bg:#060609; --surface:rgba(18,18,24,.88); --solid:#111116; --soft:#191922; --soft-2:#232330; --border:#272734;
  --border-accent:rgba(244,63,94,.42);
  --text:#f8fafc; --muted:#9ca3b5;
  --primary:#f43f5e; --primary-bright:#fb7185; --primary-2:#f97316; --primary-soft:rgba(244,63,94,.15);
  --ok:#10b981; --ok-soft:rgba(16,185,129,.15);
  --warn:#f59e0b; --warn-soft:rgba(245,158,11,.15);
  --bad:#ef4444; --bad-soft:rgba(239,68,68,.18);
  --glow-1:rgba(225,29,72,.22); --glow-2:rgba(153,27,27,.14);
  --shadow:0 2px 6px rgba(0,0,0,.55),0 18px 40px -12px rgba(0,0,0,.82),inset 0 1px 0 rgba(255,255,255,.06);
  --grad:linear-gradient(135deg,#f43f5e 0%,#dc2626 50%,#991b1b 100%);
  --grad-hero:linear-gradient(135deg,#090507 0%,#1a070b 38%,#5c0e17 78%,#be123c 100%);
  color-scheme:dark;
  accent-color:var(--primary);
  scrollbar-color:var(--primary) var(--soft);
}

/* =========================================================
   2. BASE & MOBILE-FIRST ERGONOMICS
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
::selection{background:var(--primary);color:#fff}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overscroll-behavior-y:none}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(var(--tab-h) + 32px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  transition:background-color .28s,color .28s;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(65% 42% at 8% 0%,var(--glow-1),transparent 72%),
             radial-gradient(55% 38% at 95% 4%,var(--glow-2),transparent 70%);
}
button,a,label,input,select{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;user-select:none;-webkit-user-select:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{text-wrap:balance}
h2{font-size:1.38rem;font-weight:800;letter-spacing:-.025em}
h3{font-size:1rem;font-weight:750;letter-spacing:-.01em}
p,.hint{text-wrap:pretty}
.muted{color:var(--muted)} .small{font-size:.8rem} .mt{margin-top:12px} .mb{margin-bottom:12px}
.container{max-width:840px;margin:0 auto;padding:0 14px}
@media(min-width:480px){.container{padding:0 16px}h2{font-size:1.46rem}}
.row{display:flex;align-items:center;gap:10px} .row.between{justify-content:space-between} .grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}

/* Header */
.app-header{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--border);
  box-shadow:0 4px 24px -10px rgba(0,0,0,.35)}
.app-header::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--grad);opacity:.85}
.app-header .container{display:flex;align-items:center;justify-content:space-between;height:60px;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.brand-logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 18px -5px rgba(225,29,72,.6),inset 0 1px 0 rgba(255,255,255,.25);flex:none}
.brand h1{font-size:1.14rem;font-weight:800;letter-spacing:-.025em;line-height:1}
.brand h1 span{color:var(--primary)}
.brand small{display:block;font-size:.68rem;color:var(--muted);font-weight:650;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;gap:6px;flex:none}

/* Sync status pill */
.sync-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:.75rem;font-weight:700;
  border:1px solid var(--border);background:var(--solid);cursor:pointer;transition:all .2s;text-decoration:none}
.sync-pill:hover{border-color:var(--primary);transform:translateY(-1px)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#959cba;display:inline-block;transition:background .3s}
.sync-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--border))}
.sync-ok .sync-dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync-busy{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--border))}
.sync-busy .sync-dot{background:var(--warn);animation:pulse 1s infinite}
.sync-err{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--border))}
.sync-err .sync-dot{background:var(--bad)}
.sync-off{color:var(--muted)}
.sync-off .sync-dot{background:var(--muted)}
@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}

/* Pages */
.page{display:none;padding-top:16px}
.page.active{display:block;animation:pageIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-head p{font-size:.86rem;margin-top:2px}

/* Card */
.card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;transition:border-color .22s,box-shadow .22s}
.card:hover{border-color:color-mix(in srgb,var(--primary) 22%,var(--border))}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head .card-title{margin-bottom:2px}
.grid-2{display:grid;grid-template-columns:1fr;gap:14px}
.grid-2>.card{margin-bottom:0}
.grid-2.mb-gap{margin-bottom:14px}
@media(min-width:720px){.grid-2{grid-template-columns:1fr 1fr}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--solid);
  padding:10px 14px;border-radius:12px;font-weight:700;font-size:.86rem;transition:transform .14s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--border));background:var(--soft)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.42;pointer-events:none}
.btn-primary{background:var(--grad);color:#fff;border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 20px -6px rgba(220,38,38,.55)}
.btn-primary:hover{box-shadow:0 10px 26px -6px rgba(225,29,72,.72);filter:brightness(1.07);background:var(--grad);border-color:rgba(255,255,255,.25)}
.btn-soft{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 28%,transparent)}
.btn-soft:hover{background:color-mix(in srgb,var(--primary) 22%,transparent);border-color:var(--primary)}
.btn-danger{background:var(--bad);color:#fff;border:none}
.btn-danger-soft{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.btn-sm{padding:7px 11px;font-size:.79rem;border-radius:10px}
.btn-block{width:100%}
.btn-icon{width:38px;height:38px;flex:none;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--border);background:var(--solid);transition:transform .14s,background .2s,border-color .2s}
.btn-icon:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--border));background:var(--soft)}
.btn-icon:active{transform:scale(.91)}
.btn-icon.ghost{border-color:transparent;background:transparent}
.btn-icon.ghost:hover{background:var(--soft);border-color:var(--border)}
.btn-icon svg{width:18px;height:18px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* Inputs (16px minimum on mobile to prevent iOS auto-zoom) */
.input,select.input,textarea.input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--soft);
  font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;font-variant-numeric:tabular-nums}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--solid)}
.input:user-invalid{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.input-sm{padding:8px 10px;font-size:15px;border-radius:10px}
textarea.input{resize:vertical;min-height:70px;field-sizing:content}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field>span{font-size:.78rem;font-weight:650;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.form-grid.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:480px){.form-grid.three{grid-template-columns:1fr 1fr}}
@media(max-width:360px){.form-grid{grid-template-columns:1fr}}
.hint{font-size:.78rem;color:var(--muted);background:var(--soft);border:1px solid var(--border);padding:9px 12px;border-radius:12px;margin:2px 0 12px;line-height:1.45}

/* Segmented control */
.seg{display:flex;background:var(--soft);padding:4px;border-radius:14px;gap:4px;border:1px solid var(--border);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:none;background:transparent;padding:8px 12px;border-radius:10px;font-weight:700;font-size:.81rem;color:var(--muted);transition:all .2s;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--grad);color:#fff;box-shadow:0 4px 12px -2px rgba(220,38,38,.45)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;padding:3px 9px;border-radius:99px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip-ok{background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 25%,transparent)}
.chip-warn{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.chip-bad{background:var(--bad-soft);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 25%,transparent)}
.chip-muted{background:var(--soft);color:var(--muted);border:1px solid var(--border)}
.chip-primary{background:var(--primary-soft);color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 28%,transparent)}

/* Progress metrics */
.metric{margin-bottom:14px}
.metric:last-child{margin-bottom:0}
.metric-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.metric-label{font-weight:650;font-size:.87rem;display:flex;align-items:center;gap:6px}
.metric-val{font-size:.82rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.metric-val b{color:var(--text);font-size:.92rem}
.metric-sub{font-size:.75rem;color:var(--muted);margin-top:5px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.04)}
.bar-fill{height:100%;border-radius:inherit;transition:width .55s cubic-bezier(.2,.8,.2,1)}
.bar-ok .bar-fill{background:linear-gradient(90deg,#059669,#34d399)}
.bar-warn .bar-fill{background:linear-gradient(90deg,#d97706,#fbbf24)}
.bar-bad .bar-fill{background:linear-gradient(90deg,#dc2626,#fb7185)}
.bar-primary .bar-fill{background:var(--grad)}
.bar-marker{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.45}
.anim .bar-fill{animation:grow .85s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}

/* Hero Command Center (Dashboard) */
.hero{background:var(--grad-hero);color:#fff;border:1px solid rgba(244,63,94,.38);position:relative;overflow:hidden;padding:20px;
  box-shadow:0 16px 40px -12px rgba(190,18,60,.45),inset 0 1px 0 rgba(255,255,255,.15)}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:260px;height:260px;right:-70px;top:-90px;background:radial-gradient(circle,rgba(244,63,94,.35) 0%,transparent 70%)}
.hero::after{width:190px;height:190px;left:-60px;bottom:-80px;background:radial-gradient(circle,rgba(220,38,38,.25) 0%,transparent 70%)}
.hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:16px;justify-content:space-between}
.hero-date{font-size:.76rem;color:rgba(255,255,255,.8);font-weight:650;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.12)}
.hero h2{font-size:1.15rem;margin:8px 0 4px;color:rgba(255,255,255,.92);font-weight:700}
.hero-big{font-size:2.35rem;font-weight:800;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero-big small{font-size:1rem;font-weight:650;opacity:.85}
.hero-sub{font-size:.79rem;color:rgba(255,255,255,.84);margin-top:6px;font-variant-numeric:tabular-nums}
.ring{position:relative;width:118px;height:118px;flex:none;filter:drop-shadow(0 4px 14px rgba(244,63,94,.45))}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{stroke:rgba(255,255,255,.16)}
.ring-prog{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);animation:ringIn 1s cubic-bezier(.2,.8,.2,1)}
@keyframes ringIn{from{stroke-dashoffset:314.16}}
.ring-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:1.38rem;line-height:1;font-variant-numeric:tabular-nums}
.ring-label small{display:block;font-size:.64rem;font-weight:650;opacity:.85;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}

/* Hero Macro Strip & Quick Dock */
.hero-pills{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
@media(max-width:460px){.hero-pills{grid-template-columns:repeat(2,1fr)}}
.hero-pill{background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:7px 9px;font-variant-numeric:tabular-nums}
.hero-pill small{display:block;font-size:.66rem;color:rgba(255,255,255,.68);font-weight:600}
.hero-pill b{font-size:.82rem;color:#fff;font-weight:750}
.hero-quick{position:relative;z-index:1;display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.hero-quick button{flex:1;min-width:115px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);color:#fff;
  padding:8px 10px;border-radius:11px;font-size:.77rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:all .18s}
.hero-quick button:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);transform:translateY(-1px)}
.hero-quick button:active{transform:scale(.96)}
.hero-quick button.hq-primary{background:linear-gradient(135deg,#f43f5e,#dc2626);border-color:rgba(255,255,255,.28);box-shadow:0 4px 14px rgba(225,29,72,.45)}

/* Stat tiles (2x2 on phones, 4 cols on tablet/desktop) */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:13px 13px;box-shadow:var(--shadow);text-align:left;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);opacity:.45}
.stat-ico{font-size:1.2rem;width:32px;height:32px;border-radius:10px;background:var(--primary-soft);display:grid;place-items:center}
.stat-val{font-size:1.42rem;font-weight:800;letter-spacing:-.025em;margin-top:7px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-val small{font-size:.75rem;color:var(--muted);font-weight:650}
.stat-lbl{font-size:.72rem;color:var(--muted);font-weight:600;margin-top:3px}

/* Creatine & Hydration Tracker Card */
.creatine-card{border:1.5px solid color-mix(in srgb,var(--primary) 42%,var(--border));position:relative;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--primary-soft) 42%,var(--surface)),var(--surface))}
.creatine-card.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--border));
  background:linear-gradient(160deg,color-mix(in srgb,var(--ok-soft) 38%,var(--surface)),var(--surface))}
.creatine-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.creatine-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.creatine-day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:12px;background:var(--soft);border:1px solid var(--border);font-size:.68rem;font-weight:700;color:var(--muted);cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.creatine-day:hover{border-color:var(--primary)}
.creatine-day:active{transform:scale(.94)}
.creatine-day.today{border-color:var(--primary);color:var(--text);background:var(--primary-soft)}
.creatine-day .dot,.creatine-day .c-dot{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:.74rem;font-weight:800;background:var(--solid);border:1.5px solid var(--border);color:var(--muted);font-variant-numeric:tabular-nums}
.creatine-day.done .dot,.creatine-day.taken .c-dot{background:linear-gradient(135deg,#059669,#10b981);border-color:transparent;color:#fff;box-shadow:0 3px 10px -2px rgba(16,185,129,.5)}
.creatine-day.partial .dot,.creatine-day.partial .c-dot{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.creatine-timings{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin-top:8px}
.creatine-timings::-webkit-scrollbar{display:none}
.timing-pill{border:1px solid var(--border);background:var(--soft);padding:6px 11px;border-radius:99px;font-size:.75rem;font-weight:650;color:var(--muted);white-space:nowrap;transition:all .18s}
.timing-pill:hover{border-color:var(--primary);color:var(--text)}
.timing-pill.active{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 50%,transparent);font-weight:750}
.water-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border:1px solid var(--border);padding:10px 12px;border-radius:14px;margin-top:10px;flex-wrap:wrap}
.water-pills{display:flex;gap:3px;margin-top:5px}
.water-seg{height:5px;flex:1;border-radius:99px;background:var(--border);transition:background .25s}
.water-seg.on{background:var(--primary)}
.sat-box{background:var(--soft);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin:10px 0}
.sat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.78rem;font-weight:700;margin-bottom:5px}
.dose-slots{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:10px 0}
@media(min-width:520px){.dose-slots{grid-template-columns:repeat(4,1fr)}}
.dose-slot{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:12px;border:1px solid var(--border);background:var(--soft);font-size:.75rem;font-weight:700;cursor:pointer;transition:all .16s}
.dose-slot:hover{border-color:var(--primary)}
.dose-slot.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,var(--border));color:var(--ok)}
.creatine-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.gym-creatine-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 14px;border-radius:16px;margin-bottom:14px;
  background:linear-gradient(135deg,var(--primary-soft),var(--surface));border:1px solid var(--border-accent)}
.gym-creatine-bar.done{background:linear-gradient(135deg,var(--ok-soft),var(--surface));border-color:color-mix(in srgb,var(--ok) 45%,var(--border))}
.cr-hdr-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:.73rem;font-weight:800;border:1px solid var(--border-accent);background:var(--primary-soft);color:var(--primary);cursor:pointer;transition:all .18s;font-variant-numeric:tabular-nums}
.cr-hdr-pill:hover{transform:translateY(-1px);border-color:var(--primary)}
.cr-hdr-pill.done{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}

/* Lists */
.list{list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:.88rem}
.list li:last-child{border-bottom:none}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:.9rem}
.empty-sm{color:var(--muted);font-size:.82rem;padding:6px 0}
.big-emoji{font-size:2.4rem;display:block;margin-bottom:6px}

/* Date navigator & 7-Day Interactive Week Strip */
.date-nav-wrap{margin-bottom:14px}
.date-nav{display:flex;align-items:center;gap:8px}
.date-display{flex:1;position:relative;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;font-weight:700;font-size:.88rem;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .2s}
.date-display:hover{border-color:var(--primary)}
.date-display .today-tag{color:var(--primary);font-weight:800}
.date-display input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:all .16s;font-variant-numeric:tabular-nums}
.wk-day:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--border))}
.wk-day:active{transform:scale(.94)}
.wk-day .wk-lbl{font-size:.64rem;font-weight:650;color:var(--muted);text-transform:uppercase}
.wk-day .wk-num{font-size:.84rem;font-weight:800;color:var(--text);line-height:1.2}
.wk-day .wk-dot{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:1px}
.wk-day.has-ok .wk-dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.wk-day.has-part .wk-dot{background:var(--warn)}
.wk-day.is-today{border-color:color-mix(in srgb,var(--primary) 55%,var(--border))}
.wk-day.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px -4px rgba(220,38,38,.55)}
.wk-day.active .wk-lbl,.wk-day.active .wk-num{color:#fff}
.wk-day.active .wk-dot{background:#fff}

/* Smart Protein Gap Banner */
.gap-banner{background:linear-gradient(135deg,var(--primary-soft),color-mix(in srgb,var(--soft) 85%,transparent));border:1px solid var(--border-accent);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.gap-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.82rem;font-weight:750;color:var(--text)}
.gap-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gap-chip{border:1px solid color-mix(in srgb,var(--primary) 35%,var(--border));background:var(--solid);padding:6px 10px;border-radius:10px;font-size:.76rem;font-weight:700;display:inline-flex;align-items:center;gap:5px;transition:all .16s}
.gap-chip:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px)}
.gap-chip:active{transform:scale(.95)}
.gap-chip b{color:var(--primary)}

/* Meal slots */
.slot-head{display:flex;align-items:center;gap:10px}
.slot-icon{width:42px;height:42px;border-radius:13px;background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);display:grid;place-items:center;font-size:1.25rem;flex:none}
.slot-tot{font-size:.75rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.slot-quick{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 2px;margin-top:6px;border-top:1px dashed var(--border)}
.slot-quick::-webkit-scrollbar{display:none}
.slot-quick-lbl{font-size:.68rem;font-weight:700;color:var(--muted);white-space:nowrap}
.sq-pill{border:1px solid var(--border);background:var(--soft);padding:4px 9px;border-radius:99px;font-size:.73rem;font-weight:650;white-space:nowrap;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.sq-pill:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.sq-pill:active{transform:scale(.94)}
.entry-list{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.entry{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--border);padding:10px 12px;border-radius:14px;flex-wrap:wrap}
.entry-main{flex:1;min-width:140px}
.entry-name{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{font-size:.72rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;background:var(--solid);border:1px solid var(--border);border-radius:11px;overflow:hidden;flex:none}
.stepper button{border:none;background:transparent;width:34px;height:36px;font-size:1.15rem;font-weight:800;color:var(--primary);transition:background .15s}
.stepper button:hover{background:var(--primary-soft)}
.stepper button:active{background:var(--primary);color:#fff}
.stepper input{width:42px;border:none;background:transparent;text-align:center;font-weight:750;font-size:16px;outline:none;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.quick-actions .btn:first-child{grid-column:1/-1;padding:12px}

/* Food pick list */
.food-pick{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.food-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--border);background:var(--soft);padding:11px 12px;border-radius:14px;transition:border-color .2s,transform .15s}
.food-item:hover{border-color:var(--primary)}
.food-item:active{transform:scale(.99)}
.food-item .fi-main{flex:1;min-width:0}
.food-item b{display:block;font-size:.9rem}
.food-item span{font-size:.74rem;color:var(--muted)}
.fi-add{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;box-shadow:0 4px 10px -2px rgba(220,38,38,.45)}
.nutri{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* Cost tiles */
.cost-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.cost-grid{grid-template-columns:1fr 1fr}}
.cost-tile{background:var(--soft);border:1px solid var(--border);border-radius:16px;padding:12px}
.cost-tile .lbl{font-size:.75rem;color:var(--muted);font-weight:650}
.cost-tile .val{font-size:1.25rem;font-weight:800;margin:2px 0 8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Gym Exercise Cards & Media */
.session-head{position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:25;background:color-mix(in srgb,var(--solid) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:color-mix(in srgb,var(--primary) 30%,var(--border))}
.session-head select{margin-top:4px}
.ex-card{transition:border-color .3s,box-shadow .3s}
.ex-card.complete{border-color:color-mix(in srgb,var(--ok) 58%,var(--border));box-shadow:0 8px 28px -12px rgba(16,185,129,.25)}
.ex-top-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ex-thumb-btn{position:relative;width:58px;height:58px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--soft);flex:none;cursor:pointer;padding:0}
.ex-thumb-img{width:100%;height:100%;object-fit:cover;display:block}
.ex-thumb-play{position:absolute;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;color:#fff;font-size:.9rem;transition:background .2s}
.ex-thumb-btn:hover .ex-thumb-play{background:rgba(225,29,72,.78)}
.ex-title-info{flex:1;min-width:0}
.ex-title-info h3{font-size:1rem;line-height:1.2}
.ex-target{font-size:.77rem;color:var(--muted);margin-top:3px}
.ex-title-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.prev{font-size:.76rem;background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin:8px 0 0;color:var(--muted)}
.prev b{color:var(--text);font-weight:700}
.prev-note{margin-top:4px;font-style:italic}
.suggest{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);border-radius:12px;padding:9px 11px;margin-top:8px;font-weight:650}
.suggest.info{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.set-row{display:grid;grid-template-columns:28px minmax(0,1.15fr) minmax(0,1.25fr) 42px;gap:7px;align-items:center;padding:6px 6px;border-radius:12px;background:color-mix(in srgb,var(--soft) 55%,transparent);border:1px solid transparent;transition:background .22s,border-color .22s}
.set-row.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.set-head{font-size:.67rem;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 6px;background:transparent;border:none}
.set-no{width:26px;height:26px;border-radius:8px;background:var(--soft);border:1px solid var(--border);display:grid;place-items:center;font-size:.77rem;font-weight:800;font-variant-numeric:tabular-nums}
.set-row.done .set-no{background:var(--ok);border-color:transparent;color:#fff}
.rep-box{display:flex;align-items:center;background:var(--soft);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.rep-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);background:var(--solid)}
.rep-box button{border:none;background:transparent;width:28px;height:36px;font-weight:800;font-size:1rem;color:var(--muted);flex:none;transition:color .15s,background .15s}
.rep-box button:hover{color:var(--primary);background:var(--primary-soft)}
.rep-box button:active{background:var(--primary);color:#fff}
.rep-box input{width:100%;min-width:0;border:none;background:transparent;text-align:center;font-weight:750;font-size:15px;padding:6px 2px;outline:none;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.rep-box input::-webkit-outer-spin-button,.rep-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.check{position:relative;width:42px;height:40px;display:inline-block}
.check input{appearance:none;-webkit-appearance:none;width:42px;height:40px;border-radius:11px;border:2px solid var(--border);background:var(--solid);cursor:pointer;transition:all .2s;margin:0}
.check input:hover{border-color:var(--primary)}
.check input:checked{background:linear-gradient(135deg,#059669,#10b981);border-color:transparent;transform:scale(1.04);box-shadow:0 4px 12px -2px rgba(16,185,129,.5)}
.check span{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#fff;font-weight:900;opacity:0;transition:opacity .2s}
.check input:checked+span{opacity:1}
.check span::after{content:'✓';font-size:1.15rem}
.ex-foot-bar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--border);flex-wrap:wrap}
.rest-card{text-align:center;padding:28px 18px}
.schedule-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.schedule-row .day{width:70px;font-weight:650;font-size:.88rem}
.ex-line{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--border)}
.ex-line:last-of-type{border-bottom:none}
.ex-line .grow b{font-size:.88rem;display:block}
.ex-line .grow span{font-size:.74rem;color:var(--muted)}
.ex-actions{display:flex;gap:2px}
.ex-actions .btn-icon{width:34px;height:34px;border-radius:9px;font-size:.85rem}

/* Movement Guide Modal */
.guide-media-box{position:relative;width:100%;padding-top:56.25%;background:#060609;border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.guide-media-box iframe,.guide-media-box img,.guide-media-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:none}
.guide-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.guide-cues{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.guide-cue{display:flex;align-items:flex-start;gap:10px;font-size:.87rem;line-height:1.45}
.guide-num{width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:800;font-size:.75rem;display:grid;place-items:center;flex:none;margin-top:2px}
.guide-box{background:var(--soft);border-radius:14px;padding:12px;margin-top:10px;font-size:.84rem}
.guide-box.warn{background:var(--bad-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.guide-box b{display:block;margin-bottom:4px}
.guide-box.warn b{color:var(--bad)}

/* Cloud SQL snippet box */
.code-box{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.76rem;overflow-x:auto;white-space:pre;user-select:all;color:var(--text);margin-top:6px}

/* Charts */
.chart-box{position:relative;height:230px}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.85rem;text-align:center;padding:10px}

/* Bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:0 8px env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--solid) 90%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);box-shadow:0 -8px 28px -12px rgba(0,0,0,.5)}
.tabbar-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:700;color:var(--muted);transition:color .2s;position:relative}
.tab .tab-ico{width:50px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .25s,transform .2s,box-shadow .25s;position:relative}
.tab svg{width:20px;height:20px}
.tab.active{color:var(--primary)}
.tab.active .tab-ico{background:var(--primary-soft);transform:translateY(-1px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 32%,transparent)}
.tab:active .tab-ico{transform:scale(.9)}
.tab-badge{position:absolute;top:-3px;right:2px;font-size:.58rem;font-weight:800;padding:1px 5px;border-radius:99px;background:var(--grad);color:#fff;line-height:1.25;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tab-badge.ok{background:var(--ok)}

/* Rest timer */
.timer{position:fixed;left:50%;bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom));z-index:60;width:min(94%,510px);
  transform:translate(-50%,140%);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s;
  background:var(--solid);border:1.5px solid var(--border-accent);border-radius:20px;
  box-shadow:0 18px 42px -10px rgba(0,0,0,.75),0 0 24px -8px rgba(225,29,72,.35);
  padding:10px 12px;display:flex;align-items:center;gap:9px}
.timer.show{transform:translate(-50%,0);opacity:1}
.timer.finished{border-color:var(--ok);box-shadow:0 18px 42px -10px rgba(0,0,0,.75),0 0 24px -6px rgba(16,185,129,.45)}
.timer-ring{position:relative;width:52px;height:52px;flex:none}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:5}
.timer-ring .t-track{stroke:var(--soft)}
.timer-ring .t-prog{stroke:var(--primary);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer.finished .t-prog{stroke:var(--ok)}
.timer-text{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.timer-info{flex:1;min-width:0}
.timer-info b{font-size:.87rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-info span{font-size:.72rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Modal (bottom-sheet di HP, dialog di desktop) */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(4,4,7,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.modal-backdrop[hidden]{display:none}
.modal-backdrop.open{opacity:1}
.modal{background:var(--solid);border:1px solid var(--border);width:100%;max-width:560px;max-height:88vh;max-height:88dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -12px 48px rgba(0,0,0,.65)}
.modal-backdrop.open .modal{transform:none}
.modal-handle{width:42px;height:5px;border-radius:99px;background:var(--border);margin:10px auto 0;flex:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:1.06rem}
.modal-body{padding:12px 18px 14px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--border)}
.modal-foot:empty{display:none}
.modal-foot .btn{flex:1}
@media(min-width:640px){.modal-backdrop{align-items:center}.modal{border-radius:24px;transform:translateY(30px) scale(.97)}.modal-handle{display:none}.modal-foot .btn{flex:none}}

/* QR Box & Device Modal */
.qr-modal-box{background:#fff;padding:14px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.22);display:inline-flex;justify-content:center;align-items:center;margin:8px auto}
.qr-modal-box img,.qr-modal-box canvas{display:block;border-radius:8px}
.device-badge-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--soft);border:1px solid var(--border);margin-bottom:10px}

/* Toast */
.toasts{position:fixed;left:50%;top:68px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92%,420px);pointer-events:none}
.toast{pointer-events:auto;background:var(--solid);color:var(--text);border:1px solid var(--border-accent);padding:11px 14px;border-radius:14px;font-size:.85rem;font-weight:650;
  box-shadow:0 14px 34px -8px rgba(0,0,0,.65);display:flex;align-items:center;gap:10px;animation:toastIn .28s cubic-bezier(.2,.8,.2,1)}
.toast.ok{background:#065f46;border-color:#10b981;color:#fff} .toast.warn{background:#92400e;border-color:#f59e0b;color:#fff} .toast.bad{background:#991b1b;border-color:#f43f5e;color:#fff}
.toast button{margin-left:auto;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.15);color:inherit;padding:5px 10px;border-radius:8px;font-weight:750;font-size:.77rem}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .24s}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}}

.foot-note{text-align:center;color:var(--muted);font-size:.75rem;margin:8px 0 20px}
.divider{height:1px;background:var(--border);margin:14px 0}
.log-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
.log-item:last-child{border-bottom:none}
.log-item .grow b{font-size:.92rem;font-variant-numeric:tabular-nums}
.log-item .grow span{display:block;font-size:.74rem;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let _uidCounter = 0;
function uid() { return Date.now().toString(36) + (_uidCounter++).toString(36) + Math.random().toString(36).slice(2, 6); }
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => toDateStr(new Date());
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return toDateStr(d); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const weekStart = s => { const d = parseDate(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toDateStr(d); };
const num = (v, def = 0) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : def; };
const round1 = n => Math.round(n * 10) / 10;
const fmtNum = (n, dec = 0) => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: dec });
const fmtRp = n => 'Rp' + Math.round(n || 0).toLocaleString('id-ID');
const fmtRpShort = n => n >= 1000 ? 'Rp' + fmtNum(n / 1000, 1) + 'rb' : fmtRp(n);
const fmtDateLong = s => { const d = parseDate(s); return `${DAY_NAMES[d.getDay()]}, ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDateShort = s => { const d = parseDate(s); return `${d.getDate()} ${MONTH_SHORT[d.getMonth()]}`; };
const fmtDateDay = s => { const d = parseDate(s); return `${DAY_NAMES[d.getDay()].slice(0, 3)}, ${d.getDate()} ${MONTH_SHORT[d.getMonth()]}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const formData = f => Object.fromEntries(new FormData(f).entries());
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function seededRandom(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

/* =========================================================
   3. PENYIMPANAN & STATE
   ========================================================= */
function createDefaultState() {
  return {
    version: 1,
    updatedAt: null,
    _dirty: false,
    settings: clone(DEFAULT_SETTINGS),
    foods: clone(DEFAULT_FOODS),
    template: clone(DEFAULT_TEMPLATE),
    program: createDefaultProgram(),
    meals: {},
    creatine: {},
    sessions: {},
    bodyLogs: [],
    sampleLoaded: false,
  };
}

function normalizeState(raw) {
  const base = createDefaultState();
  if (!raw || typeof raw !== 'object') return base;
  const obj = v => v && typeof v === 'object' && !Array.isArray(v);
  const cloud = { ...base.settings.cloud, ...(obj(raw.settings?.cloud) ? raw.settings.cloud : {}) };
  if (!cloud.migratedToBuiltinV2) {
    if (!cloud.supabaseUrl && !cloud.firebaseConfig) {
      cloud.enabled = true;
      cloud.provider = 'builtin';
      if (!cloud.syncKey || cloud.syncKey.startsWith('otot_')) {
        cloud.syncKey = DEFAULT_SYNC_KEY;
      }
    }
    cloud.objectId = cloud.objectId || BUILTIN_CLOUD_OBJECT_ID;
    cloud.migratedToBuiltinV2 = true;
  }
  const mergedSettings = { ...base.settings, ...(obj(raw.settings) ? raw.settings : {}), cloud };
  if (!mergedSettings.migratedRedBlackV1) {
    mergedSettings.theme = 'dark';
    mergedSettings.migratedRedBlackV1 = true;
  }
  if (!(mergedSettings.creatineTarget > 0)) mergedSettings.creatineTarget = 5;
  if (!(mergedSettings.waterTarget > 0)) mergedSettings.waterTarget = 10;
  return {
    ...base,
    updatedAt: raw.updatedAt || null,
    _dirty: !!raw._dirty,
    sampleLoaded: !!raw.sampleLoaded,
    settings: mergedSettings,
    foods: Array.isArray(raw.foods) ? raw.foods : base.foods,
    template: obj(raw.template) ? { ...base.template, ...raw.template } : base.template,
    program: obj(raw.program) && obj(raw.program.workouts)
      ? { schedule: { ...base.program.schedule, ...(raw.program.schedule || {}) }, workouts: raw.program.workouts }
      : base.program,
    meals: obj(raw.meals) ? raw.meals : {},
    creatine: obj(raw.creatine) ? raw.creatine : {},
    sessions: obj(raw.sessions) ? raw.sessions : {},
    bodyLogs: Array.isArray(raw.bodyLogs) ? raw.bodyLogs : [],
  };
}

/** LocalStorage & Cloud Auto-Sync */
const Store = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      console.error('Gagal membaca localStorage:', err);
      setTimeout(() => toast('Gagal membaca data tersimpan. Memulai dengan data baru.', 'bad'), 300);
      return null;
    }
  },
  saveLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    } catch (err) {
      console.error('Gagal menyimpan localStorage:', err);
      toast('Gagal menyimpan data (penyimpanan penuh/diblokir).', 'bad');
      return false;
    }
  },
  size() {
    try { return (localStorage.getItem(STORAGE_KEY) || '').length; } catch (err) { return 0; }
  },
};

function save() {
  state.updatedAt = new Date().toISOString();
  state._dirty = true;
  const ok = Store.saveLocal();
  if (state.settings?.cloud?.enabled && state.settings?.cloud?.autoSync) {
    clearTimeout(Cloud._debounceTimer);
    Cloud._debounceTimer = setTimeout(() => {
      Cloud.push();
    }, 900);
  }
  return ok;
}

/* =========================================================
   4. CLOUD SYNC (CLOUD TERINTEGRASI, SUPABASE & FIREBASE)
   ========================================================= */
const Cloud = {
  client: null,
  status: 'ready', // 'offline' | 'ready' | 'syncing' | 'error'
  statusMsg: 'Cloud Aktif',
  _debounceTimer: null,
  _sse: null,
  _sseTopic: null,
  _isPulling: false,
  deviceId: 'dev_' + Math.random().toString(36).slice(2, 10),

  cleanTopic(syncKey) {
    const clean = String(syncKey || DEFAULT_SYNC_KEY).trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_');
    return 'ototku_live_' + (clean || DEFAULT_SYNC_KEY);
  },

  init() {
    this.setupClient();
    if (state.settings?.cloud?.enabled && state.settings?.cloud?.autoSync) {
      this.pull({ silent: true });
    }
    // Sinkronisasi otomatis saat kembali membuka tab di HP / Laptop atau saat sinyal kembali online
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.settings?.cloud?.enabled) {
        if (state._dirty) this.push();
        else this.pull({ silent: true });
      }
    });
    window.addEventListener('focus', () => {
      if (state.settings?.cloud?.enabled && !state._dirty) {
        this.pull({ silent: true });
      }
    });
    window.addEventListener('online', () => {
      if (state.settings?.cloud?.enabled) {
        this.setupClient();
        if (state._dirty) this.push();
        else this.pull({ silent: true });
      }
    });
  },

  setupRealtimeListener() {
    const c = state.settings?.cloud;
    if (!c || !c.enabled || typeof EventSource === 'undefined') {
      if (this._sse) { try { this._sse.close(); } catch (e) {} this._sse = null; this._sseTopic = null; }
      return;
    }
    const topic = this.cleanTopic(c.syncKey);
    if (this._sse && this._sseTopic === topic) return;
    if (this._sse) { try { this._sse.close(); } catch (e) {} this._sse = null; }
    this._sseTopic = topic;

    try {
      const es = new EventSource(`${BUILTIN_NTFY_BASE}/${topic}/sse`);
      es.onmessage = ev => {
        try {
          const outer = JSON.parse(ev.data);
          if (!outer || outer.event !== 'message' || !outer.message) return;
          const msg = JSON.parse(outer.message);
          if (!msg || msg.type !== 'ototku_sync' || msg.deviceId === this.deviceId) return;
          if (msg.objectId && c.provider === 'builtin') {
            c.objectId = msg.objectId;
          }
          if (!state.updatedAt || ! msg.updatedAt || msg.updatedAt > state.updatedAt) {
            this.pull({ silent: true });
          }
        } catch (e) {}
      };
      this._sse = es;
    } catch (e) {
      console.warn('Realtime SSE listener warning:', e);
    }
  },

  setupClient() {
    const c = state.settings.cloud;
    if (!c || !c.enabled) {
      this.client = null;
      this.status = 'offline';
      this.statusMsg = 'Lokal';
      this.setupRealtimeListener();
      this.updateBadge();
      return;
    }

    if (!c.provider || c.provider === 'builtin') {
      c.provider = 'builtin';
      c.objectId = c.objectId || BUILTIN_CLOUD_OBJECT_ID;
      this.client = { type: 'builtin' };
      this.status = 'ready';
      this.statusMsg = 'Cloud Aktif';
    } else if (c.provider === 'supabase') {
      if (typeof window.supabase !== 'undefined' && c.supabaseUrl && c.supabaseKey) {
        try {
          this.client = window.supabase.createClient(c.supabaseUrl.trim(), c.supabaseKey.trim());
          this.status = 'ready';
          this.statusMsg = 'Supabase Aktif';
        } catch (e) {
          console.error('Supabase init error:', e);
          this.status = 'error';
          this.statusMsg = 'Gagal Supabase';
        }
      } else {
        this.status = 'offline';
        this.statusMsg = 'Supabase belum lengkap';
      }
    } else if (c.provider === 'firebase') {
      if (typeof window.firebase !== 'undefined' && c.firebaseConfig) {
        try {
          let conf = c.firebaseConfig;
          if (typeof conf === 'string' && conf.trim().startsWith('{')) {
            conf = JSON.parse(conf);
          } else if (typeof conf === 'string') {
            conf = { databaseURL: conf.trim() };
          }
          if (!window.firebase.apps.length) {
            window.firebase.initializeApp(conf);
          }
          this.client = window.firebase.database();
          this.status = 'ready';
          this.statusMsg = 'Firebase Aktif';
        } catch (e) {
          console.error('Firebase init error:', e);
          this.status = 'error';
          this.statusMsg = 'Gagal Firebase';
        }
      } else {
        this.status = 'offline';
        this.statusMsg = 'Firebase belum lengkap';
      }
    }
    this.setupRealtimeListener();
    this.updateBadge();
  },

  updateBadge() {
    const txt = $('#syncStatusText');
    const badge = $('#syncStatusBadge');
    if (!txt || !badge) return;
    txt.textContent = this.statusMsg;
    badge.className = 'sync-pill ' + (
      this.status === 'ready' ? 'sync-ok' :
      this.status === 'syncing' ? 'sync-busy' :
      this.status === 'error' ? 'sync-err' : 'sync-off'
    );
  },

  async push({ manual = false } = {}) {
    const c = state.settings.cloud;
    if (!this.client || !c?.enabled) {
      if (manual) toast('Cloud belum diaktifkan atau belum lengkap', 'warn');
      return;
    }
    const syncKey = (c.syncKey || DEFAULT_SYNC_KEY).trim();
    this.status = 'syncing';
    this.statusMsg = 'Menyimpan...';
    this.updateBadge();

    try {
      const nowIso = state.updatedAt || new Date().toISOString();
      state.updatedAt = nowIso;
      const cleanSettings = clone(state.settings);
      const payload = {
        app: 'OtotKu',
        updatedAt: nowIso,
        version: state.version || 1,
        sampleLoaded: !!state.sampleLoaded,
        settings: cleanSettings,
        foods: state.foods,
        template: state.template,
        program: state.program,
        meals: state.meals,
        creatine: state.creatine,
        sessions: state.sessions,
        bodyLogs: state.bodyLogs,
      };

      if (c.provider === 'builtin') {
        let objId = c.objectId || BUILTIN_CLOUD_OBJECT_ID;
        let savedOk = false;

        // 1. Simpan ke REST Cloud Database utama
        try {
          let existingUsers = {};
          try {
            const getRes = await fetch(`${BUILTIN_CLOUD_API}/${objId}`, { cache: 'no-store' });
            if (getRes.ok) {
              const cur = await getRes.json();
              if (cur && cur.data && typeof cur.data.users === 'object') {
                existingUsers = cur.data.users;
              }
            }
          } catch (e) {}

          existingUsers[syncKey] = payload;
          const bodyObj = {
            name: 'ototku_cloud_db',
            data: {
              app: 'OtotKu',
              updatedAt: nowIso,
              users: existingUsers,
              ...(syncKey === DEFAULT_SYNC_KEY ? payload : {})
            }
          };

          let putRes = await fetch(`${BUILTIN_CLOUD_API}/${objId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyObj)
          });

          if (!putRes.ok && (putRes.status === 404 || putRes.status === 405)) {
            const postRes = await fetch(BUILTIN_CLOUD_API, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(bodyObj)
            });
            if (postRes.ok) {
              const created = await postRes.json();
              if (created && created.id) {
                objId = created.id;
                c.objectId = objId;
                savedOk = true;
              }
            }
          } else if (putRes.ok) {
            savedOk = true;
          }
        } catch (errRest) {
          console.warn('Primary cloud REST warning:', errRest);
        }

        // 2. Kirim broadcast realtime + backup ringkas ke ntfy channel
        try {
          const compactBackup = {
            app: 'OtotKu',
            updatedAt: nowIso,
            sampleLoaded: !!state.sampleLoaded,
            settings: cleanSettings,
            foods: state.foods,
            template: state.template,
            meals: state.meals,
            creatine: state.creatine,
            sessions: state.sessions,
            bodyLogs: state.bodyLogs,
          };
          let ntfyMsg = JSON.stringify({
            type: 'ototku_sync',
            deviceId: this.deviceId,
            syncKey,
            objectId: objId,
            updatedAt: nowIso,
            backup: compactBackup
          });
          if (ntfyMsg.length > 3800) {
            ntfyMsg = JSON.stringify({
              type: 'ototku_sync',
              deviceId: this.deviceId,
              syncKey,
              objectId: objId,
              updatedAt: nowIso
            });
          }
          const ntfyRes = await fetch(`${BUILTIN_NTFY_BASE}/${this.cleanTopic(syncKey)}`, {
            method: 'POST',
            body: ntfyMsg
          });
          if (ntfyRes.ok) savedOk = true;
        } catch (errNtfy) {
          console.warn('Realtime sync channel warning:', errNtfy);
        }

        if (!savedOk) throw new Error('Tidak dapat menghubungi server Cloud. Periksa koneksi internet.');
      } else if (c.provider === 'supabase') {
        const { error } = await this.client
          .from('ototku_sync')
          .upsert({ user_id: syncKey, data: payload, updated_at: nowIso });
        if (error) throw error;
      } else if (c.provider === 'firebase') {
        await this.client.ref('ototku/' + syncKey).set(payload);
      }

      state._dirty = false;
      c.lastSyncedAt = new Date().toISOString();
      Store.saveLocal();
      this.status = 'ready';
      this.statusMsg = 'Tersimpan';
      this.updateBadge();
      if (manual) toast('☁️ Data berhasil disimpan ke Cloud!', 'ok');
    } catch (err) {
      console.error('Cloud Push error:', err);
      this.status = 'error';
      this.statusMsg = 'Gagal Sync';
      this.updateBadge();
      if (manual) toast('Gagal simpan ke Cloud: ' + (err.message || err), 'bad');
    }
  },

  async pull({ manual = false, silent = false } = {}) {
    const c = state.settings.cloud;
    if (!this.client || !c?.enabled) {
      if (manual) toast('Cloud belum diaktifkan atau belum lengkap', 'warn');
      return;
    }
    if (this._isPulling && !manual) return;
    this._isPulling = true;

    const syncKey = (c.syncKey || DEFAULT_SYNC_KEY).trim();
    this.status = 'syncing';
    this.statusMsg = 'Mengunduh...';
    this.updateBadge();

    try {
      let cloudData = null;

      if (c.provider === 'builtin') {
        let objId = c.objectId || BUILTIN_CLOUD_OBJECT_ID;
        let ntfyBackup = null;

        // 1. Cek channel sinkronisasi untuk pointer objectId terbaru & backup instan
        try {
          const ntfyRes = await fetch(`${BUILTIN_NTFY_BASE}/${this.cleanTopic(syncKey)}/json?poll=1&since=all`, { cache: 'no-store' });
          if (ntfyRes.ok) {
            const text = await ntfyRes.text();
            const lines = text.trim().split('\n').filter(Boolean);
            for (let i = lines.length - 1; i >= 0; i--) {
              try {
                const ev = JSON.parse(lines[i]);
                if (ev && ev.message) {
                  const msg = JSON.parse(ev.message);
                  if (msg && msg.type === 'ototku_sync' && (!msg.syncKey || msg.syncKey === syncKey)) {
                    if (msg.objectId) {
                      objId = msg.objectId;
                      c.objectId = objId;
                    }
                    if (msg.backup && msg.backup.settings) {
                      ntfyBackup = msg.backup;
                    }
                    break;
                  }
                }
              } catch (e) {}
            }
          }
        } catch (e) {}

        // 2. Ambil data lengkap dari REST Cloud Database utama
        try {
          const res = await fetch(`${BUILTIN_CLOUD_API}/${objId}`, { cache: 'no-store' });
          if (res.ok) {
            const json = await res.json();
            const d = json && json.data;
            if (d) {
              if (d.users && d.users[syncKey] && d.users[syncKey].settings) {
                cloudData = d.users[syncKey];
              } else if (d.settings && syncKey === DEFAULT_SYNC_KEY) {
                cloudData = d;
              }
            }
          }
        } catch (e) {}

        // Pilih data terbaru antara REST DB dan ntfyBackup
        if (ntfyBackup && (!cloudData || (ntfyBackup.updatedAt && (!cloudData.updatedAt || ntfyBackup.updatedAt > cloudData.updatedAt)))) {
          cloudData = ntfyBackup;
        }

        // 3. Fallback ke db.json statis di repo jika belum ada di cloud
        if (!cloudData && syncKey === DEFAULT_SYNC_KEY) {
          try {
            const seedRes = await fetch('./db.json?t=' + Date.now(), { cache: 'no-store' });
            if (seedRes.ok) {
              const seedJson = await seedRes.json();
              if (seedJson && seedJson.settings) cloudData = seedJson;
            }
          } catch (e) {}
        }
      } else if (c.provider === 'supabase') {
        const { data, error } = await this.client
          .from('ototku_sync')
          .select('data, updated_at')
          .eq('user_id', syncKey)
          .single();
        if (error && error.code !== 'PGRST116') throw error;
        cloudData = data ? data.data : null;
      } else if (c.provider === 'firebase') {
        const snap = await this.client.ref('ototku/' + syncKey).once('value');
        cloudData = snap.val();
      }

      if (cloudData && cloudData.settings) {
        const localHasNewer = state._dirty && state.updatedAt && cloudData.updatedAt && state.updatedAt > cloudData.updatedAt;
        if (localHasNewer && !manual) {
          this._isPulling = false;
          await this.push({ manual: false });
          return;
        }
        const currentCloudConf = clone(state.settings.cloud);
        state = normalizeState(cloudData);
        state.settings.cloud = {
          ...currentCloudConf,
          objectId: currentCloudConf.objectId || BUILTIN_CLOUD_OBJECT_ID,
          lastSyncedAt: new Date().toISOString()
        };
        state.updatedAt = cloudData.updatedAt || new Date().toISOString();
        state._dirty = false;
        Store.saveLocal();
        this.status = 'ready';
        this.statusMsg = 'Tersinkron';
        this.updateBadge();
        renderCurrent();
        if (!silent) toast('☁️ Data Cloud berhasil disinkronkan!', 'ok');
      } else {
        this.status = 'ready';
        this.statusMsg = 'Cloud Siap';
        this.updateBadge();
        await this.push();
        if (!silent) toast('Cloud dihubungkan, data lokal berhasil diunggah!', 'ok');
      }
    } catch (err) {
      console.error('Cloud Pull error:', err);
      this.status = 'error';
      this.statusMsg = 'Gagal Sync';
      this.updateBadge();
      if (!silent) toast('Gagal mengambil data Cloud: ' + (err.message || err), 'bad');
    } finally {
      this._isPulling = false;
    }
  }
};

  const notes = ['Energi bagus, tidur 7 jam.', 'Agak capek, tapi semua set selesai.', 'Fokus form & tempo pelan.', 'Pump mantap! 💪'];

  for (let i = SAMPLE_DAYS; i >= 1; i--) {

      const entries = [];
      MEAL_SLOTS.forEach(sl => (state.template[sl.id] || []).forEach(t => {
        const f = findFood(t.foodId);
        if (f) entries.push(makeMealEntry(f, sl.id, t.qty, true));
      }));
      const r = rnd(), egg = findFood('telur'), tempe = findFood('tempe');
      if (r < 0.4 && egg) entries.push(makeMealEntry(egg, 'malam', 1, true));
      else if (r < 0.65 && tempe) entries.push(makeMealEntry(tempe, 'sore', 1, true));

    const wid = state.program.schedule[parseDate(date).getDay()];

      s.completed = true;
      s.notes = notes[Math.floor(rnd() * notes.length)];
      s.entries.forEach(en => {
        const hitTop = rnd() < 0.35;
        en.sets.forEach((st, k) => {
          let reps = en.repMin + Math.floor(rnd() * (en.repMax - en.repMin + 1));
          if (hitTop) reps = en.repMax;
          else if (k === en.sets.length - 1) reps = Math.min(reps, en.repMax - 1);
          st.done = true; st.reps = reps; st.weight = en.wMin;
        });
      });
      state.sessions[date] = s;
    }

    if (!state.creatine[date]) {
      state.creatine[date] = {
        grams: state.settings.creatineTarget || 5,
        timing: state.program.workouts[wid] ? 'Post-Gym' : 'Pagi',
        water: 8 + Math.floor(rnd() * 3),

      };
    }
  }

  [[-22, 54.2, 27.8, 84.0, 48.0], [-15, 54.5, 28.0, 84.5, 48.3], [-8, 54.7, 28.1, 84.8, 48.5], [-1, 55.0, 28.3, 85.2, 48.8]]

const findFood = id => state.foods.find(f => f.id === id);
const foodPrice = f => (f.priceMax && num(f.priceMax) > 0) ? (num(f.priceMin) + num(f.priceMax)) / 2 : num(f.priceMin);
const foodPriceText = f => (f.priceMax && num(f.priceMax) !== num(f.priceMin) && num(f.priceMax) > 0)
  ? `${fmtRp(f.priceMin)}–${Math.round(num(f.priceMax)).toLocaleString('id-ID')}` : fmtRp(f.priceMin);

function makeMealEntry(food, slot, qty = 1, sample = false) {
  const e = { id: uid(), foodId: food.id, name: food.name, portion: food.portion,
    protein: num(food.protein), kcal: num(food.kcal), satFat: num(food.satFat), price: foodPrice(food), slot, qty };
  if (sample) e.sample = true;
  return e;
}

function sumEntries(list) {
  return list.reduce((t, e) => {
    t.protein += e.protein * e.qty; t.kcal += e.kcal * e.qty;
    t.satFat += e.satFat * e.qty;   t.cost += e.price * e.qty;
    return t;
  }, { protein: 0, kcal: 0, satFat: 0, cost: 0 });
}
const dayTotals = date => sumEntries(state.meals[date] || []);
const hasMeals = date => (state.meals[date] || []).length > 0;

function rangeTotals(start, end) {
  const t = { protein: 0, kcal: 0, satFat: 0, cost: 0, days: 0 };
  Object.keys(state.meals).forEach(d => {
    if (d >= start && d <= end && state.meals[d].length) {
      const x = dayTotals(d);
      t.protein += x.protein; t.kcal += x.kcal; t.satFat += x.satFat; t.cost += x.cost; t.days++;
    }
  });
  return t;
}

function nowTimeStr() {
  const n = new Date();
  return `${pad(n.getHours())}:${pad(n.getMinutes())}`;
}

function getCreatine(date) {
  const c = (state.creatine && state.creatine[date]) || {};
  return {
    grams: round1(num(c.grams, 0)),
    timing: c.timing || 'post',
    mix: c.mix || 'air',
    takenAt: c.takenAt || '',
    slots: Array.isArray(c.slots) ? c.slots : [],
    water: Math.max(0, Math.round(num(c.water, 0))),
    note: c.note || '',
  };
}

function setCreatine(date, patch) {
  state.creatine = state.creatine || {};
  const cur = getCreatine(date);
  const next = { ...cur, ...patch };
  next.grams = Math.max(0, round1(num(next.grams, 0)));
  next.water = Math.max(0, Math.round(num(next.water, 0)));
  if (next.grams > cur.grams && !('takenAt' in patch)) {
    next.takenAt = nowTimeStr();
  } else if (next.grams <= 0) {
    next.takenAt = '';
    next.slots = [];
  }
  if (next.grams <= 0 && next.water <= 0 && !next.note) {
    delete state.creatine[date];
  } else {
    state.creatine[date] = next;
  }
}

function creatineStreak() {
  const target = state.settings.creatineTarget || 5;
  let d = todayStr(), count = 0;
  if (getCreatine(d).grams < target) d = addDays(d, -1);
  while (getCreatine(d).grams >= target) { count++; d = addDays(d, -1); }
  return count;
}

function bestCreatineStreak() {
  const target = state.settings.creatineTarget || 5;
  const dates = Object.keys(state.creatine || {}).filter(d => getCreatine(d).grams >= target).sort();
  let best = 0, cur = 0, prev = null;
  dates.forEach(d => { cur = (prev && addDays(prev, 1) === d) ? cur + 1 : 1; best = Math.max(best, cur); prev = d; });
  return best;
}

function creatineSaturationStats(refDate = todayStr()) {
  const target = state.settings.creatineTarget || 5;
  let last28Grams = 0, daysHit30 = 0, totalGrams30 = 0;
  for (let i = 0; i < 30; i++) {
    const d = addDays(refDate, -i);
    const g = getCreatine(d).grams;
    totalGrams30 += g;
    if (g >= Math.min(target, 3)) daysHit30++;
    if (i < 28) last28Grams += Math.min(20, g);
  }
  // Standar saturasi otot: ~140g dalam 28 hari (28×5g maintenance atau 7×20g loading)
  const saturationPct = Math.min(100, Math.round((last28Grams / 140) * 100));
  let statusLabel, statusShort, barCls;
  if (saturationPct >= 95) {
    statusLabel = '100% Optimal Saturated 🔥 · Performa ATP Maksimal';
    statusShort = 'Optimal 🔥';
    barCls = 'ok';
  } else if (saturationPct >= 70) {
    statusLabel = 'Hampir Penuh · Tenaga eksplosif meningkat';
    statusShort = 'Tinggi';
    barCls = 'ok';
  } else if (saturationPct >= 30) {
    statusLabel = 'Fase Akumulasi · Cadangan fosfokreatin bertambah';
    statusShort = 'Akumulasi';
    barCls = 'warn';
  } else {
    statusLabel = 'Fase Awal · Konsumsi rutin setiap hari';
    statusShort = 'Fase Awal';
    barCls = 'primary';
  }
  return { saturationPct, daysHit30, totalGrams30: round1(totalGrams30), statusLabel, statusShort, barCls };
}

function proteinStreak() {
  const min = state.settings.proteinMin;
  let d = todayStr(), count = 0;
  if (dayTotals(d).protein < min) d = addDays(d, -1);
  while (dayTotals(d).protein >= min) { count++; d = addDays(d, -1); }
  return count;
}
function bestProteinStreak() {
  const min = state.settings.proteinMin;
  const dates = Object.keys(state.meals).filter(d => dayTotals(d).protein >= min).sort();
  let best = 0, cur = 0, prev = null;
  dates.forEach(d => { cur = (prev && addDays(prev, 1) === d) ? cur + 1 : 1; best = Math.max(best, cur); prev = d; });
  return best;
}

const completedSessions = () => Object.entries(state.sessions).filter(([, s]) => s.completed);
const sessionsInWeek = ws => { const we = addDays(ws, 6); return completedSessions().filter(([d]) => d >= ws && d <= we).length; };
const weeklySessionTarget = () => Object.values(state.program.schedule).filter(id => state.program.workouts[id]).length || 4;
const sortedDumbbells = () => [...state.settings.dumbbells].sort((a, b) => a - b);

function sessionProgress(sess) {
  let done = 0, total = 0, volume = 0;
  sess.entries.forEach(e => e.sets.forEach(s => {
    total++;
    if (s.done) {
      done++;
      if (e.unit !== 'detik') volume += num(s.weight) * num(s.reps);
    }
  }));
  return { done, total, volume: Math.round(volume) };
}

function getWorkoutForDate(date) {
  if (state.sessions[date]) return state.sessions[date].workoutId;
  if (ui.gymOverride[date]) return ui.gymOverride[date];
  return state.program.schedule[parseDate(date).getDay()] || 'rest';
}

function findPrevEntry(date, exId, name) {
  const dates = Object.keys(state.sessions).filter(d => d < date).sort().reverse();
  const lname = (name || '').toLowerCase();
  for (const d of dates) {
    const s = state.sessions[d];
    const entry = s.entries.find(e => e.exId === exId && e.sets.some(x => x.done)) ||
                  s.entries.find(e => e.name.toLowerCase() === lname && e.sets.some(x => x.done));
    if (entry) return { date: d, entry };
  }
  return null;
}

function overloadSuggestion(prev, ex) {
  if (!prev) return null;
  const sets = prev.entry.sets;
  const allTop = sets.length > 0 && sets.every(s => s.done && num(s.reps) >= ex.repMax);
  if (!allTop) return null;
  if (ex.unit === 'detik')
    return { title: 'Tingkatkan durasi', text: `Semua set mencapai ${ex.repMax} detik. Tambah 5–10 detik atau gunakan variasi lebih sulit.` };
  const maxW = Math.max(...sets.map(s => num(s.weight)));
  const next = sortedDumbbells().find(w => w > maxW);
  if (next == null)
    return { title: 'Beban maksimal tercapai', text: `Semua set ${ex.repMax} rep dengan ${maxW} kg. Tambah 1 set, perlambat tempo (3 detik turun), atau jeda 1 detik di posisi tersulit.` };
  return { title: `Naikkan beban: ${maxW} → ${next} kg`, text: `Semua set sesi lalu mencapai ${ex.repMax} rep. Mulai dari ${ex.repMin} rep dengan beban baru.`, weight: next };
}

function buildSession(workoutId, date) {
  const w = state.program.workouts[workoutId];
  return {
    workoutId, workoutName: w.name, completed: false, notes: '',
    entries: w.exercises.map(e => {
      const prev = findPrevEntry(date, e.id, e.name);
      const sug = overloadSuggestion(prev, e);
      const prevW = prev ? Math.max(...prev.entry.sets.map(s => num(s.weight))) : null;
      const weight = sug && sug.weight ? sug.weight : (prevW != null ? prevW : e.wMin);
      return {
        exId: e.id, name: e.name, unit: e.unit, perSide: e.perSide,
        repMin: e.repMin, repMax: e.repMax, wMin: e.wMin, wMax: e.wMax, note: '',
        target: e.target || '', media: e.media || '', video: e.video || '',
        cues: e.cues || '', mistakes: e.mistakes || '',
        sets: Array.from({ length: e.sets }, () => ({ done: false, reps: '', weight })),
      };
    }),
  };
}

function getSessionView(date) {
  if (state.sessions[date]) return state.sessions[date];
  const wid = getWorkoutForDate(date);
  if (!state.program.workouts[wid]) return null;
  if (!ui.draft || ui.draft._date !== date || ui.draft.workoutId !== wid) {
    ui.draft = buildSession(wid, date);

function commitSession(date) {
  if (!state.sessions[date] && ui.draft && ui.draft._date === date) {
    const s = ui.draft; delete s._date;
    state.sessions[date] = s;
    ui.draft = null;
  }
  return state.sessions[date];
}

function weightText(e) {

function applyWeight(w, announce = false) {
  const s = state.settings;

function nextMealSlot() {

function toast(msg, type = '', action = null) {
  const box = $('#toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span>${msg}</span>`;
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = () => { action.fn(); el.remove(); };
    el.appendChild(b);
  }
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, action ? 4500 : 2600);
}

const Timer = {
  end: 0, total: 0, interval: null, audio: null, hideT: null, paused: false, leftPaused: 0,
  C: 2 * Math.PI * 23,
  start(sec, subText = 'Tarik napas, siapkan set berikutnya') {
    sec = Math.max(5, Math.round(sec));
    try { if (!this.audio) this.audio = new (window.AudioContext || window.webkitAudioContext)(); if (this.audio.state === 'suspended') this.audio.resume(); } catch (e) { }
    clearTimeout(this.hideT);
    this.paused = false;
    this.total = sec; this.end = Date.now() + sec * 1000;
    const t = $('#timer'); t.classList.add('show'); t.classList.remove('finished');
    $('#timerTitle').textContent = 'Istirahat';
    $('#timerSub').textContent = subText;
    const pb = $('#timerPauseBtn'); if (pb) pb.textContent = '⏸';
    clearInterval(this.interval);
    this.interval = setInterval(() => this.tick(), 250);
    this.tick();
  },
  pause() {
    const pb = $('#timerPauseBtn');
    if (this.paused) {
      this.paused = false;
      this.end = Date.now() + this.leftPaused * 1000;
      $('#timerTitle').textContent = 'Istirahat';
      if (pb) pb.textContent = '⏸';
      clearInterval(this.interval);
      this.interval = setInterval(() => this.tick(), 250);
      this.tick();
    } else if (this.interval) {
      this.paused = true;
      this.leftPaused = Math.max(1, Math.ceil((this.end - Date.now()) / 1000));
      clearInterval(this.interval);
      this.interval = null;
      $('#timerTitle').textContent = 'Timer Dijeda';
      if (pb) pb.textContent = '▶';
    }
  },
  add(sec) {
    if (this.paused) {
      this.leftPaused = Math.max(5, this.leftPaused + sec);
      this.total = Math.max(5, this.total + sec);
      $('#timerText').textContent = `${Math.floor(this.leftPaused / 60)}:${pad(this.leftPaused % 60)}`;
      $('#timerProg').style.strokeDashoffset = this.C * (1 - this.leftPaused / this.total);
      return;
    }
    if (!this.interval) return this.start(Math.max(15, sec));
    this.end += sec * 1000;
    this.total = Math.max(5, this.total + sec);
    this.tick();
  },
  stop() { clearInterval(this.interval); this.interval = null; this.paused = false; $('#timer').classList.remove('show'); },
  tick() {
    const left = Math.max(0, Math.ceil((this.end - Date.now()) / 1000));
    $('#timerText').textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
    $('#timerProg').style.strokeDashoffset = this.C * (1 - left / this.total);
    if (left <= 0) this.finish();
  },
  finish() {
    clearInterval(this.interval); this.interval = null; this.paused = false;
    $('#timer').classList.add('finished');
    $('#timerTitle').textContent = 'Waktu istirahat habis!';
    $('#timerSub').textContent = 'Lanjut ke set berikutnya 💪';
    this.beep();
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { }
    this.hideT = setTimeout(() => this.stop(), 6000);
  },
  beep() {
    try {
      const ctx = this.audio; if (!ctx) return;
      [0, 0.25, 0.5].forEach((t, k) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = k === 2 ? 1046 : 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.2);
        o.connect(g).connect(ctx.destination);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.22);
      });
    } catch (e) { }
  },
};

  const weekCount = sessionsInWeek(weekStart(today)), weekTarget = weeklySessionTarget();
  const total = completedSessions().length;
  const logs = sortedLogs(), last = logs[logs.length - 1], first = logs[0];
  const since = last ? daysBetween(last.date, today) : null;

  $('#page-dashboard').innerHTML = `
    <div class="card hero">
      <div class="hero-inner">
        <div>
          <div class="hero-date">🔥 ${greet} · ${fmtDateLong(today)}</div>
          <h2>Sisa target protein harian</h2>
          ${left > 0
            ? `<div class="hero-big">${fmtNum(left, 1)}<small> g lagi</small></div>`
            : `<div class="hero-big">Tercapai! <small>🎉</small></div>`}
          <div class="hero-sub">${fmtNum(t.protein, 1)} / ${s.proteinTarget} g · rentang ${s.proteinMin}–${s.proteinMax} g</div>
        </div>
        <div class="ring" aria-label="Progres protein ${Math.round(pct * 100)} persen">
          <svg viewBox="0 0 120 120"><circle class="ring-track" cx="60" cy="60" r="50" fill="none" stroke-width="11"/>

        <div class="hero-pill"><small>💧 Hidrasi</small><b>${cr.water} / ${wTarget} gls</b></div>
        <div class="hero-pill"><small>💰 Biaya</small><b>${fmtRpShort(t.cost)}</b></div>
      </div>
      <div class="hero-quick">
        <button type="button" class="hq-primary" data-action="dashAddSlot" data-slot="${(next && next.id) || 'pagi'}">🍽️ + Catat Makan</button>
        <button type="button" data-action="creatineQuick" data-date="${today}" data-grams="${cTarget}">${cr.grams >= cTarget ? `✓ Creatine ${fmtNum(cr.grams, 1)}g` : `⚡ +${cTarget}g Creatine`}</button>

    <div class="stats">
