<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">

<meta name="description" content="Pantau protein, kalori, lemak jenuh, biaya makan, dan progres latihan dumbbell 4 hari per minggu dengan sinkronisasi cloud Supabase/Firebase.">
<meta name="theme-color" content="#f4f5fb">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Offline QR Code Generator -->
<script src="qrcode.min.js" defer></script>
<!-- Chart.js dari cdnjs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<!-- Supabase Client CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<!-- Firebase Compat SDK CDN -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js" defer></script>

<style>
/* =========================================================
   1. DESIGN TOKENS (mode terang & gelap)
   ========================================================= */
:root{
  --bg:#f4f5fb; --surface:rgba(255,255,255,.86); --solid:#ffffff; --soft:#eef0f7; --border:#e4e7f1;
  --text:#141a2e; --muted:#69718a;
  --primary:#6c4cf0; --primary-2:#0ea5e9; --primary-soft:rgba(108,76,240,.1);
  --ok:#0f9f6e; --ok-soft:rgba(16,185,129,.13);
  --warn:#c77d02; --warn-soft:rgba(245,158,11,.16);
  --bad:#e03e3e; --bad-soft:rgba(239,68,68,.12);
  --glow-1:rgba(108,76,240,.16); --glow-2:rgba(14,165,233,.13);
  --shadow:0 1px 2px rgba(20,26,60,.04),0 10px 30px -12px rgba(20,26,60,.14);
  --radius:20px; --tab-h:68px;
  --grad:linear-gradient(135deg,#6c4cf0 0%,#8b5cf6 45%,#0ea5e9 100%);
}
[data-theme="dark"]{
  --bg:#0a0c16; --surface:rgba(22,25,42,.82); --solid:#151829; --soft:#1e2238; --border:#272c45;
  --text:#eceefa; --muted:#959cba;
  --primary:#8b72ff; --primary-2:#38bdf8; --primary-soft:rgba(139,114,255,.16);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.14);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
  --bad:#f87171; --bad-soft:rgba(248,113,113,.15);
  --glow-1:rgba(139,114,255,.2); --glow-2:rgba(56,189,248,.1);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.55);
  --grad:linear-gradient(135deg,#5b3fe0 0%,#7c4ddb 45%,#0b86c4 100%);
  color-scheme:dark;
}

/* =========================================================
   2. BASE
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom));
  transition:background-color .3s,color .3s;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 0% 0%,var(--glow-1),transparent 70%),
             radial-gradient(50% 35% at 100% 5%,var(--glow-2),transparent 70%);
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h2{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
h3{font-size:1rem;font-weight:700}
.muted{color:var(--muted)} .small{font-size:.8rem} .mt{margin-top:12px} .mb{margin-bottom:12px}
.container{max-width:820px;margin:0 auto;padding:0 16px}
.row{display:flex;align-items:center;gap:10px} .row.between{justify-content:space-between} .grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}

/* Header */
.app-header{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  background:color-mix(in srgb,var(--bg) 75%,transparent);border-bottom:1px solid var(--border)}
.app-header .container{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px var(--primary)}
.brand h1{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-size:.7rem;color:var(--muted);font-weight:600;margin-top:2px}
.header-actions{display:flex;align-items:center;gap:8px}

/* Sync status pill */
.sync-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;font-size:.76rem;font-weight:700;border:1px solid var(--border);background:var(--solid);cursor:pointer;transition:all .2s;text-decoration:none}
.sync-pill:hover{border-color:var(--primary)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#959cba;display:inline-block;transition:background .3s}
.sync-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--border))}
.sync-ok .sync-dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync-busy{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--border))}
.sync-busy .sync-dot{background:var(--warn);animation:pulse 1s infinite}
.sync-err{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--border))}
.sync-err .sync-dot{background:var(--bad)}
.sync-off{color:var(--muted)}
.sync-off .sync-dot{background:var(--muted)}
@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}

/* Pages */
.page{display:none;padding-top:18px}
.page.active{display:block;animation:pageIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head p{font-size:.88rem;margin-top:2px}

/* Card */
.card{background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head .card-title{margin-bottom:2px}
.grid-2{display:grid;grid-template-columns:1fr;gap:14px}
.grid-2>.card{margin-bottom:0}
.grid-2.mb-gap{margin-bottom:14px}
@media(min-width:720px){.grid-2{grid-template-columns:1fr 1fr}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--solid);
  padding:10px 14px;border-radius:12px;font-weight:650;font-size:.88rem;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--grad);color:#fff;border:none;box-shadow:0 8px 18px -8px var(--primary)}
.btn-primary:hover{box-shadow:0 10px 22px -8px var(--primary);filter:brightness(1.05)}
.btn-soft{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.btn-danger{background:var(--bad);color:#fff;border:none}
.btn-danger-soft{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn-sm{padding:7px 11px;font-size:.8rem;border-radius:10px}
.btn-block{width:100%}
.btn-icon{width:38px;height:38px;flex:none;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--border);background:var(--solid);transition:transform .15s,background .2s}
.btn-icon:active{transform:scale(.92)}
.btn-icon.ghost{border-color:transparent;background:transparent}
.btn-icon.ghost:hover{background:var(--soft)}
.btn-icon svg{width:18px;height:18px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* Inputs */
.input,select.input,textarea.input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--soft);
  font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--solid)}
.input-sm{padding:8px 10px;font-size:15px;border-radius:10px}
textarea.input{resize:vertical;min-height:70px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field>span{font-size:.78rem;font-weight:650;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.form-grid.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:420px){.form-grid.three{grid-template-columns:1fr 1fr}}
.hint{font-size:.78rem;color:var(--muted);background:var(--soft);padding:8px 10px;border-radius:10px;margin:2px 0 12px}

/* Segmented control */
.seg{display:flex;background:var(--soft);padding:4px;border-radius:14px;gap:4px;border:1px solid var(--border)}
.seg button{flex:1;border:none;background:transparent;padding:8px 12px;border-radius:10px;font-weight:650;font-size:.84rem;color:var(--muted);transition:all .2s;white-space:nowrap}
.seg button.active{background:var(--solid);color:var(--primary);box-shadow:0 2px 8px -2px rgba(0,0,0,.12)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;padding:3px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.chip-ok{background:var(--ok-soft);color:var(--ok)} .chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-bad{background:var(--bad-soft);color:var(--bad)} .chip-muted{background:var(--soft);color:var(--muted)}
.chip-primary{background:var(--primary-soft);color:var(--primary)}

/* Progress metrics */
.metric{margin-bottom:14px}
.metric:last-child{margin-bottom:0}
.metric-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.metric-label{font-weight:650;font-size:.88rem;display:flex;align-items:center;gap:6px}
.metric-val{font-size:.82rem;color:var(--muted);text-align:right}
.metric-val b{color:var(--text);font-size:.92rem}
.metric-sub{font-size:.75rem;color:var(--muted);margin-top:5px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:inherit;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar-ok .bar-fill{background:linear-gradient(90deg,#10b981,#34d399)}
.bar-warn .bar-fill{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar-bad .bar-fill{background:linear-gradient(90deg,#ef4444,#fb7185)}
.bar-primary .bar-fill{background:var(--grad)}
.bar-marker{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.35}
.anim .bar-fill{animation:grow .9s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}

/* Hero (dashboard) */
.hero{background:var(--grad);color:#fff;border:none;position:relative;overflow:hidden;padding:20px}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::before{width:220px;height:220px;right:-60px;top:-80px}
.hero::after{width:140px;height:140px;left:-50px;bottom:-70px}
.hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:16px;justify-content:space-between}
.hero-date{font-size:.78rem;opacity:.85;font-weight:600}
.hero h2{font-size:1.3rem;margin:4px 0 6px}
.hero-big{font-size:2.3rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero-big small{font-size:1rem;font-weight:600;opacity:.85}
.hero-sub{font-size:.8rem;opacity:.9;margin-top:6px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{stroke:rgba(255,255,255,.22)}
.ring-prog{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes ringIn{from{stroke-dashoffset:314.16}}
.ring-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:1.4rem;line-height:1}
.ring-label small{display:block;font-size:.65rem;font-weight:600;opacity:.85;margin-top:3px}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow);text-align:left}
.stat-ico{font-size:1.3rem}
.stat-val{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.stat-val small{font-size:.75rem;color:var(--muted);font-weight:600}
.stat-lbl{font-size:.72rem;color:var(--muted);font-weight:600;margin-top:2px}

/* Lists */
.list{list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:.88rem}
.list li:last-child{border-bottom:none}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:.9rem}
.empty-sm{color:var(--muted);font-size:.82rem;padding:6px 0}
.big-emoji{font-size:2.4rem;display:block;margin-bottom:6px}

/* Date navigator */
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.date-display{flex:1;position:relative;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:9px 10px;font-weight:650;font-size:.9rem;cursor:pointer;min-width:0}
.date-display .today-tag{color:var(--primary)}
.date-display input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* Meal slots */
.slot-head{display:flex;align-items:center;gap:10px}
.slot-icon{width:42px;height:42px;border-radius:13px;background:var(--primary-soft);display:grid;place-items:center;font-size:1.25rem;flex:none}
.slot-tot{font-size:.75rem;color:var(--muted);margin-top:2px}
.entry-list{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.entry{display:flex;align-items:center;gap:10px;background:var(--soft);padding:10px;border-radius:14px}
.entry-main{flex:1;min-width:0}
.entry-name{font-weight:650;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{font-size:.72rem;color:var(--muted);margin-top:2px}
.stepper{display:flex;align-items:center;background:var(--solid);border:1px solid var(--border);border-radius:10px;overflow:hidden;flex:none}
.stepper button{border:none;background:transparent;width:30px;height:32px;font-size:1.1rem;font-weight:700;color:var(--primary)}
.stepper button:active{background:var(--primary-soft)}
.stepper input{width:38px;border:none;background:transparent;text-align:center;font-weight:700;font-size:15px;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.quick-actions .btn:first-child{grid-column:1/-1;padding:13px}

/* Food pick list */
.food-pick{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.food-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--border);background:var(--soft);padding:11px 12px;border-radius:14px;transition:border-color .2s,transform .15s}
.food-item:hover{border-color:var(--primary)}
.food-item:active{transform:scale(.99)}
.food-item .fi-main{flex:1;min-width:0}
.food-item b{display:block;font-size:.9rem}
.food-item span{font-size:.74rem;color:var(--muted)}
.fi-add{width:32px;height:32px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.nutri{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* Cost tiles */
.cost-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.cost-grid{grid-template-columns:1fr 1fr}}
.cost-tile{background:var(--soft);border-radius:16px;padding:12px}
.cost-tile .lbl{font-size:.75rem;color:var(--muted);font-weight:650}
.cost-tile .val{font-size:1.25rem;font-weight:800;margin:2px 0 8px;letter-spacing:-.02em}

/* Gym Exercise Cards & Media */
.session-head select{margin-top:4px}
.ex-card{transition:border-color .3s}
.ex-card.complete{border-color:color-mix(in srgb,var(--ok) 55%,var(--border))}
.ex-top-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ex-thumb-btn{position:relative;width:56px;height:56px;border-radius:13px;overflow:hidden;border:1px solid var(--border);background:var(--soft);flex:none;cursor:pointer;padding:0}
.ex-thumb-img{width:100%;height:100%;object-fit:cover;display:block}
.ex-thumb-play{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font-size:.9rem;transition:background .2s}
.ex-thumb-btn:hover .ex-thumb-play{background:rgba(108,76,240,.7)}
.ex-title-info{flex:1;min-width:0}
.ex-title-info h3{font-size:1rem;line-height:1.2}
.ex-target{font-size:.78rem;color:var(--muted);margin-top:3px}
.ex-title-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.prev{font-size:.76rem;background:var(--soft);border-radius:12px;padding:8px 10px;margin:8px 0 0;color:var(--muted)}
.prev b{color:var(--text);font-weight:650}
.prev-note{margin-top:4px;font-style:italic}
.suggest{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:9px 11px;margin-top:8px;font-weight:600}
.suggest.info{background:var(--primary-soft);color:var(--primary)}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.set-row{display:grid;grid-template-columns:30px minmax(0,1.25fr) minmax(0,1fr) 42px;gap:8px;align-items:center;padding:5px;border-radius:12px;transition:background .25s}
.set-row.done{background:var(--ok-soft)}
.set-head{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 5px}
.set-no{width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:.78rem;font-weight:700}
.set-row.done .set-no{background:var(--ok);color:#fff}
.check{position:relative;width:38px;height:38px;display:inline-block}
.check input{appearance:none;-webkit-appearance:none;width:38px;height:38px;border-radius:11px;border:2px solid var(--border);background:var(--solid);cursor:pointer;transition:all .2s;margin:0}
.check input:checked{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent;transform:scale(1.04)}
.check span{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#fff;font-weight:900;opacity:0;transition:opacity .2s}
.check input:checked+span{opacity:1}
.check span::after{content:'✓';font-size:1.1rem}
.rest-card{text-align:center;padding:28px 18px}
.schedule-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.schedule-row .day{width:70px;font-weight:650;font-size:.88rem}
.ex-line{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--border)}
.ex-line:last-of-type{border-bottom:none}
.ex-line .grow b{font-size:.88rem;display:block}
.ex-line .grow span{font-size:.74rem;color:var(--muted)}
.ex-actions{display:flex;gap:2px}
.ex-actions .btn-icon{width:32px;height:32px;border-radius:9px;font-size:.85rem}

/* Movement Guide Modal */
.guide-media-box{position:relative;width:100%;padding-top:56.25%;background:#090b14;border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.guide-media-box iframe,.guide-media-box img,.guide-media-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:none}
.guide-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.guide-cues{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.guide-cue{display:flex;align-items:flex-start;gap:10px;font-size:.87rem;line-height:1.45}
.guide-num{width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:.75rem;display:grid;place-items:center;flex:none;margin-top:2px}
.guide-box{background:var(--soft);border-radius:14px;padding:12px;margin-top:10px;font-size:.84rem}
.guide-box.warn{background:var(--bad-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.guide-box b{display:block;margin-bottom:4px}
.guide-box.warn b{color:var(--bad)}

/* Cloud SQL snippet box */
.code-box{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.76rem;overflow-x:auto;white-space:pre;user-select:all;color:var(--text);margin-top:6px}

/* Charts */
.chart-box{position:relative;height:230px}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.85rem;text-align:center;padding:10px}

/* Bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:0 10px env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--solid) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border)}
.tabbar-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.66rem;font-weight:650;color:var(--muted);transition:color .2s;position:relative}
.tab .tab-ico{width:46px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .25s,transform .2s}
.tab svg{width:21px;height:21px}
.tab.active{color:var(--primary)}
.tab.active .tab-ico{background:var(--primary-soft);transform:translateY(-1px)}
.tab:active .tab-ico{transform:scale(.9)}

/* Rest timer */
.timer{position:fixed;left:50%;bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom));z-index:60;width:min(94%,500px);
  transform:translate(-50%,140%);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s;
  background:var(--solid);border:1px solid var(--border);border-radius:20px;box-shadow:0 18px 40px -12px rgba(0,0,0,.35);
  padding:10px 12px;display:flex;align-items:center;gap:12px}
.timer.show{transform:translate(-50%,0);opacity:1}
.timer.finished{border-color:var(--ok)}
.timer-ring{position:relative;width:54px;height:54px;flex:none}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:5}
.timer-ring .t-track{stroke:var(--soft)}
.timer-ring .t-prog{stroke:var(--primary);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer.finished .t-prog{stroke:var(--ok)}
.timer-text{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.timer-info{flex:1;min-width:0}
.timer-info b{font-size:.9rem;display:block}
.timer-info span{font-size:.74rem;color:var(--muted)}

/* Modal (bottom-sheet di HP, dialog di desktop) */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(5,8,20,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.modal-backdrop[hidden]{display:none}
.modal-backdrop.open{opacity:1}
.modal{background:var(--solid);width:100%;max-width:560px;max-height:90vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.modal-backdrop.open .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.modal-head h3{font-size:1.1rem}
.modal-body{padding:6px 18px 12px;overflow-y:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--border)}
.modal-foot:empty{display:none}
.modal-foot .btn{flex:1}
@media(min-width:640px){.modal-backdrop{align-items:center}.modal{border-radius:24px;transform:translateY(30px) scale(.97)}.modal-foot .btn{flex:none}}

/* QR Box & Device Modal */
.qr-modal-box{background:#fff;padding:14px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.08);display:inline-flex;justify-content:center;align-items:center;margin:8px auto}
.qr-modal-box img,.qr-modal-box canvas{display:block;border-radius:8px}
.device-badge-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--soft);border:1px solid var(--border);margin-bottom:10px}

/* Toast */
.toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92%,420px);pointer-events:none}
.toast{pointer-events:auto;background:var(--text);color:var(--bg);padding:11px 14px;border-radius:14px;font-size:.85rem;font-weight:600;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px;animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
.toast.ok{background:#0f9f6e;color:#fff} .toast.warn{background:#c77d02;color:#fff} .toast.bad{background:#e03e3e;color:#fff}
.toast button{margin-left:auto;border:none;background:rgba(255,255,255,.2);color:inherit;padding:5px 10px;border-radius:8px;font-weight:700;font-size:.78rem}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .25s}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}}

.foot-note{text-align:center;color:var(--muted);font-size:.75rem;margin:8px 0 20px}
.divider{height:1px;background:var(--border);margin:14px 0}
.log-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
.log-item:last-child{border-bottom:none}
.log-item .grow b{font-size:.92rem}
.log-item .grow span{display:block;font-size:.74rem;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
let _uidCounter = 0;
function uid() { return Date.now().toString(36) + (_uidCounter++).toString(36) + Math.random().toString(36).slice(2, 6); }
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => toDateStr(new Date());
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return toDateStr(d); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const weekStart = s => { const d = parseDate(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toDateStr(d); };
const num = (v, def = 0) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : def; };
const round1 = n => Math.round(n * 10) / 10;
const fmtNum = (n, dec = 0) => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: dec });
const fmtRp = n => 'Rp' + Math.round(n || 0).toLocaleString('id-ID');
const fmtRpShort = n => n >= 1000 ? 'Rp' + fmtNum(n / 1000, 1) + 'rb' : fmtRp(n);
const fmtDateLong = s => { const d = parseDate(s); return `${DAY_NAMES[d.getDay()]}, ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDateShort = s => { const d = parseDate(s); return `${d.getDate()} ${MONTH_SHORT[d.getMonth()]}`; };
const fmtDateDay = s => { const d = parseDate(s); return `${DAY_NAMES[d.getDay()].slice(0, 3)}, ${d.getDate()} ${MONTH_SHORT[d.getMonth()]}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const formData = f => Object.fromEntries(new FormData(f).entries());
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function seededRandom(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

/* =========================================================
   3. PENYIMPANAN & STATE
   ========================================================= */
function createDefaultState() {
  return {
    version: 1,
    settings: clone(DEFAULT_SETTINGS),
    foods: clone(DEFAULT_FOODS),
    template: clone(DEFAULT_TEMPLATE),
    program: createDefaultProgram(),
    meals: {},
    sessions: {},
    bodyLogs: [],
    sampleLoaded: false,
  };
}

function normalizeState(raw) {
  const base = createDefaultState();
  if (!raw || typeof raw !== 'object') return base;
  const obj = v => v && typeof v === 'object' && !Array.isArray(v);
  const cloud = { ...base.settings.cloud, ...(obj(raw.settings?.cloud) ? raw.settings.cloud : {}) };
  return {
    ...base,
    sampleLoaded: !!raw.sampleLoaded,
    settings: { ...base.settings, ...(obj(raw.settings) ? raw.settings : {}), cloud },
    foods: Array.isArray(raw.foods) ? raw.foods : base.foods,
    template: obj(raw.template) ? { ...base.template, ...raw.template } : base.template,
    program: obj(raw.program) && obj(raw.program.workouts)
      ? { schedule: { ...base.program.schedule, ...(raw.program.schedule || {}) }, workouts: raw.program.workouts }
      : base.program,
    meals: obj(raw.meals) ? raw.meals : {},
    sessions: obj(raw.sessions) ? raw.sessions : {},
    bodyLogs: Array.isArray(raw.bodyLogs) ? raw.bodyLogs : [],
  };
}

/** LocalStorage & Cloud Auto-Sync */
const Store = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      console.error('Gagal membaca localStorage:', err);
      setTimeout(() => toast('Gagal membaca data tersimpan. Memulai dengan data baru.', 'bad'), 300);
      return null;
    }
  },
  saveLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    } catch (err) {
      console.error('Gagal menyimpan localStorage:', err);
      toast('Gagal menyimpan data (penyimpanan penuh/diblokir).', 'bad');
      return false;
    }
  },
  size() {
    try { return (localStorage.getItem(STORAGE_KEY) || '').length; } catch (err) { return 0; }
  },
};

function save() {
  const ok = Store.saveLocal();
  if (state.settings?.cloud?.enabled && state.settings?.cloud?.autoSync) {
    clearTimeout(Cloud._debounceTimer);
    Cloud._debounceTimer = setTimeout(() => {
      Cloud.push();
    }, 1200);
  }
  return ok;
}

/* =========================================================
   4. CLOUD SYNC (SUPABASE & FIREBASE)
   ========================================================= */
const Cloud = {
  client: null,
  status: 'offline', // 'offline' | 'ready' | 'syncing' | 'error'
  statusMsg: 'Lokal',
  _debounceTimer: null,

  init() {
    this.setupClient();
    if (state.settings?.cloud?.enabled && state.settings?.cloud?.autoSync) {
      this.pull({ silent: true });
    }
  },

  setupClient() {
    const c = state.settings.cloud;
    if (!c || !c.enabled) {
      this.client = null;
      this.status = 'offline';
      this.statusMsg = 'Lokal';
      this.updateBadge();
      return;
    }

    if (c.provider === 'supabase') {
      if (typeof window.supabase !== 'undefined' && c.supabaseUrl && c.supabaseKey) {
        try {
          this.client = window.supabase.createClient(c.supabaseUrl.trim(), c.supabaseKey.trim());
          this.status = 'ready';
          this.statusMsg = 'Supabase Aktif';
        } catch (e) {
          console.error('Supabase init error:', e);
          this.status = 'error';
          this.statusMsg = 'Gagal Supabase';
        }
      } else {
        this.status = 'offline';
        this.statusMsg = 'Supabase belum lengkap';
      }
    } else if (c.provider === 'firebase') {
      if (typeof window.firebase !== 'undefined' && c.firebaseConfig) {
        try {
          let conf = c.firebaseConfig;
          if (typeof conf === 'string' && conf.trim().startsWith('{')) {
            conf = JSON.parse(conf);
          } else if (typeof conf === 'string') {
            conf = { databaseURL: conf.trim() };
          }
          if (!window.firebase.apps.length) {
            window.firebase.initializeApp(conf);
          }
          this.client = window.firebase.database();
          this.status = 'ready';
          this.statusMsg = 'Firebase Aktif';
        } catch (e) {
          console.error('Firebase init error:', e);
          this.status = 'error';
          this.statusMsg = 'Gagal Firebase';
        }
      } else {
        this.status = 'offline';
        this.statusMsg = 'Firebase belum lengkap';
      }
    }
    this.updateBadge();
  },

  updateBadge() {
    const txt = $('#syncStatusText');
    const badge = $('#syncStatusBadge');
    if (!txt || !badge) return;
    txt.textContent = this.statusMsg;
    badge.className = 'sync-pill ' + (
      this.status === 'ready' ? 'sync-ok' :
      this.status === 'syncing' ? 'sync-busy' :
      this.status === 'error' ? 'sync-err' : 'sync-off'
    );
  },

  async push({ manual = false } = {}) {
    const c = state.settings.cloud;
    if (!this.client || !c?.enabled) {
      if (manual) toast('Cloud belum diaktifkan atau belum lengkap', 'warn');
      return;
    }
    const syncKey = (c.syncKey || 'default_user').trim();
    this.status = 'syncing';
    this.statusMsg = 'Menyimpan...';
    this.updateBadge();

    try {
      const payload = {
        app: 'OtotKu',
        updatedAt: new Date().toISOString(),
        version: state.version || 1,
        settings: state.settings,
        foods: state.foods,
        template: state.template,
        program: state.program,
        meals: state.meals,
        sessions: state.sessions,
        bodyLogs: state.bodyLogs,
      };

      if (c.provider === 'supabase') {
        const { error } = await this.client
          .from('ototku_sync')
          .upsert({ user_id: syncKey, data: payload, updated_at: new Date().toISOString() });
        if (error) throw error;
      } else if (c.provider === 'firebase') {
        await this.client.ref('ototku/' + syncKey).set(payload);
      }

      c.lastSyncedAt = new Date().toISOString();
      Store.saveLocal();
      this.status = 'ready';
      this.statusMsg = 'Tersimpan';
      this.updateBadge();
      if (manual) toast('☁️ Data berhasil disimpan ke Cloud!', 'ok');
    } catch (err) {
      console.error('Cloud Push error:', err);
      this.status = 'error';
      this.statusMsg = 'Gagal Sync';
      this.updateBadge();
      if (manual) toast('Gagal simpan ke Cloud: ' + (err.message || err), 'bad');
    }
  },

  async pull({ manual = false, silent = false } = {}) {
    const c = state.settings.cloud;
    if (!this.client || !c?.enabled) {
      if (manual) toast('Cloud belum diaktifkan atau belum lengkap', 'warn');
      return;
    }
    const syncKey = (c.syncKey || 'default_user').trim();
    this.status = 'syncing';
    this.statusMsg = 'Mengunduh...';
    this.updateBadge();

    try {
      let cloudData = null;
      if (c.provider === 'supabase') {
        const { data, error } = await this.client
          .from('ototku_sync')
          .select('data, updated_at')
          .eq('user_id', syncKey)
          .single();
        if (error && error.code !== 'PGRST116') throw error;
        cloudData = data ? data.data : null;
      } else if (c.provider === 'firebase') {
        const snap = await this.client.ref('ototku/' + syncKey).once('value');
        cloudData = snap.val();
      }

      if (cloudData) {
        const currentCloudConf = clone(state.settings.cloud);
        state = normalizeState(cloudData);
        state.settings.cloud = currentCloudConf;
        state.settings.cloud.lastSyncedAt = new Date().toISOString();
        Store.saveLocal();
        this.status = 'ready';
        this.statusMsg = 'Tersinkron';
        this.updateBadge();
        renderCurrent();
        if (!silent) toast('☁️ Data Cloud berhasil disinkronkan!', 'ok');
      } else {
        this.status = 'ready';
        this.statusMsg = 'Cloud Siap';
        this.updateBadge();
        await this.push();
        if (!silent) toast('Cloud baru dihubungkan, data lokal berhasil diunggah!', 'ok');
      }
    } catch (err) {
      console.error('Cloud Pull error:', err);
      this.status = 'error';
      this.statusMsg = 'Gagal Sync';
      this.updateBadge();
      if (!silent) toast('Gagal mengambil data Cloud: ' + (err.message || err), 'bad');
    }
  }
};

function generateSampleData() {
  const rnd = seededRandom(20261023);
  const today = todayStr();
  const notes = ['Energi bagus, tidur 7 jam.', 'Agak capek, tapi semua set selesai.', 'Fokus form & tempo pelan.', 'Pump mantap! 💪'];

  for (let i = SAMPLE_DAYS; i >= 1; i--) {
    const date = addDays(today, -i);

    if (!(state.meals[date] && state.meals[date].length)) {
      const entries = [];
      MEAL_SLOTS.forEach(sl => (state.template[sl.id] || []).forEach(t => {
        const f = findFood(t.foodId);
        if (f) entries.push(makeMealEntry(f, sl.id, t.qty, true));
      }));

function sumEntries(list) {

  }, { protein: 0, kcal: 0, satFat: 0, cost: 0 });
}

function rangeTotals(start, end) {
  const t = { protein: 0, kcal: 0, satFat: 0, cost: 0, days: 0 };
  Object.keys(state.meals).forEach(d => {
    if (d >= start && d <= end && state.meals[d].length) {
      const x = dayTotals(d);
      t.protein += x.protein; t.kcal += x.kcal; t.satFat += x.satFat; t.cost += x.cost; t.days++;

function proteinStreak() {
  const min = state.settings.proteinMin;
  let d = todayStr(), count = 0;
  if (dayTotals(d).protein < min) d = addDays(d, -1);
  while (dayTotals(d).protein >= min) { count++; d = addDays(d, -1); }
  return count;
}
function bestProteinStreak() {
  const min = state.settings.proteinMin;
  const dates = Object.keys(state.meals).filter(d => dayTotals(d).protein >= min).sort();
  let best = 0, cur = 0, prev = null;
  dates.forEach(d => { cur = (prev && addDays(prev, 1) === d) ? cur + 1 : 1; best = Math.max(best, cur); prev = d; });
  return best;
}

function findPrevEntry(date, exId, name) {
  const dates = Object.keys(state.sessions).filter(d => d < date).sort().reverse();
  const lname = (name || '').toLowerCase();
  for (const d of dates) {
    const s = state.sessions[d];
    const entry = s.entries.find(e => e.exId === exId && e.sets.some(x => x.done)) ||
                  s.entries.find(e => e.name.toLowerCase() === lname && e.sets.some(x => x.done));
    if (entry) return { date: d, entry };
  }
  return null;
}

function overloadSuggestion(prev, ex) {
  if (!prev) return null;
  const sets = prev.entry.sets;
  const allTop = sets.length > 0 && sets.every(s => s.done && num(s.reps) >= ex.repMax);
  if (!allTop) return null;
  if (ex.unit === 'detik')
    return { title: 'Tingkatkan durasi', text: `Semua set mencapai ${ex.repMax} detik. Tambah 5–10 detik atau gunakan variasi lebih sulit.` };
  const maxW = Math.max(...sets.map(s => num(s.weight)));
  const next = sortedDumbbells().find(w => w > maxW);
  if (next == null)
    return { title: 'Beban maksimal tercapai', text: `Semua set ${ex.repMax} rep dengan ${maxW} kg. Tambah 1 set, perlambat tempo (3 detik turun), atau jeda 1 detik di posisi tersulit.` };
  return { title: `Naikkan beban: ${maxW} → ${next} kg`, text: `Semua set sesi lalu mencapai ${ex.repMax} rep. Mulai dari ${ex.repMin} rep dengan beban baru.`, weight: next };
}

function buildSession(workoutId, date) {

      const prev = findPrevEntry(date, e.id, e.name);
      const sug = overloadSuggestion(prev, e);
      const prevW = prev ? Math.max(...prev.entry.sets.map(s => num(s.weight))) : null;
      const weight = sug && sug.weight ? sug.weight : (prevW != null ? prevW : e.wMin);
      return {
        exId: e.id, name: e.name, unit: e.unit, perSide: e.perSide,
        repMin: e.repMin, repMax: e.repMax, wMin: e.wMin, wMax: e.wMax, note: '',
        target: e.target || '', media: e.media || '', video: e.video || '',
        cues: e.cues || '', mistakes: e.mistakes || '',
        sets: Array.from({ length: e.sets }, () => ({ done: false, reps: '', weight })),
      };
    }),
  };
}

const Timer = {
  end: 0, total: 0, interval: null, audio: null, hideT: null,
  C: 2 * Math.PI * 23,
  start(sec) {
    sec = Math.max(5, Math.round(sec));
    try { if (!this.audio) this.audio = new (window.AudioContext || window.webkitAudioContext)(); if (this.audio.state === 'suspended') this.audio.resume(); } catch (e) { }
    clearTimeout(this.hideT);
    this.total = sec; this.end = Date.now() + sec * 1000;
    const t = $('#timer'); t.classList.add('show'); t.classList.remove('finished');
    $('#timerTitle').textContent = 'Istirahat';
    $('#timerSub').textContent = 'Tarik napas, siapkan set berikutnya';
    clearInterval(this.interval);
    this.interval = setInterval(() => this.tick(), 250);
    this.tick();
  },
  add(sec) {
    if (!this.interval) return this.start(Math.max(15, sec));
    this.end += sec * 1000;
    this.total = Math.max(5, this.total + sec);
    this.tick();
  },
  stop() { clearInterval(this.interval); this.interval = null; $('#timer').classList.remove('show'); },
  tick() {
    const left = Math.max(0, Math.ceil((this.end - Date.now()) / 1000));
    $('#timerText').textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
    $('#timerProg').style.strokeDashoffset = this.C * (1 - left / this.total);
    if (left <= 0) this.finish();
  },
  finish() {
    clearInterval(this.interval); this.interval = null;
    $('#timer').classList.add('finished');
    $('#timerTitle').textContent = 'Waktu istirahat habis!';
    $('#timerSub').textContent = 'Lanjut ke set berikutnya 💪';
    this.beep();
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { }
    this.hideT = setTimeout(() => this.stop(), 6000);
  },
  beep() {
    try {
      const ctx = this.audio; if (!ctx) return;
      [0, 0.25, 0.5].forEach((t, k) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = k === 2 ? 1046 : 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.2);
        o.connect(g).connect(ctx.destination);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.22);
      });
    } catch (e) { }
  },
};

function mealLogHtml() {
  const date = ui.mealDate, list = state.meals[date] || [], s = state.settings;

  const slots = MEAL_SLOTS.map(sl => {
    const items = list.filter(e => e.slot === sl.id);
    const tot = sumEntries(items);
    return `<div class="card">
      <div class="slot-head">
        <div class="slot-icon">${sl.icon}</div>
        <div class="grow"><h3>${sl.label} <span class="muted small" style="font-weight:500">${sl.time}</span></h3>
          <div class="slot-tot">${fmtNum(tot.protein, 1)} g protein · ${fmtNum(tot.kcal)} kkal · ${fmtRp(tot.cost)}</div></div>
        <button class="btn btn-sm btn-primary" data-action="openAddFood" data-slot="${sl.id}" id="add-${sl.id}">+ Tambah</button>
      </div>
      ${items.length ? `<ul class="entry-list">${items.map(e => `
        <li class="entry">
          <div class="entry-main">
            <div class="entry-name">${esc(e.name)} <span class="muted small" style="font-weight:500">· ${esc(e.portion || '')}</span></div>
            <div class="entry-meta">${fmtNum(e.protein * e.qty, 1)} g P · ${fmtNum(e.kcal * e.qty)} kkal · ${fmtNum(e.satFat * e.qty, 1)} g LJ · ${fmtRp(e.price * e.qty)}</div>
          </div>
          <div class="stepper">
            <button type="button" data-action="qtyStep" data-id="${e.id}" data-d="-1" aria-label="Kurangi">−</button>
            <input type="number" min="0" step="0.5" inputmode="decimal" value="${e.qty}" data-change="qtySet" data-id="${e.id}" aria-label="Jumlah porsi">
            <button type="button" data-action="qtyStep" data-id="${e.id}" data-d="1" aria-label="Tambah">+</button>
          </div>
          <button class="btn-icon ghost" data-action="delEntry" data-id="${e.id}" aria-label="Hapus">🗑️</button>
        </li>`).join('')}</ul>` : '<p class="empty-sm mt">Belum ada catatan untuk waktu ini.</p>'}
    </div>`;
  }).join('');

  const ws = weekStart(date), we = addDays(ws, 6);
  const wk = rangeTotals(ws, we), wkBudget = s.budget * 7;
  const d = parseDate(date), ms = toDateStr(new Date(d.getFullYear(), d.getMonth(), 1));
  const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const me = toDateStr(new Date(d.getFullYear(), d.getMonth(), daysInMonth));
  const mo = rangeTotals(ms, me), moBudget = s.budget * daysInMonth;
  const costTile = (lbl, val, budget, days, sub) => {
    const st = statusLimit(val, budget);
    return `<div class="cost-tile"><div class="lbl">${lbl}</div><div class="val">${fmtRp(val)}</div>
      <div class="bar bar-${st}"><div class="bar-fill" style="width:${Math.min(100, budget ? val / budget * 100 : 0)}%"></div></div>
      <div class="metric-sub">dari anggaran ${fmtRp(budget)} · ${days} hari tercatat${days ? ` · rata-rata ${fmtRp(val / days)}/hari` : ''}</div>
      <div class="metric-sub">${sub}</div></div>`;
  };

  return dateNav(date, 'meal') + `
    <div class="quick-actions">
      <button class="btn btn-primary" data-action="applyTemplate" id="applyTemplateBtn">⚡ Terapkan "Menu Harian Saya"</button>
      <button class="btn" data-action="copyYesterday" id="copyYesterdayBtn">📋 Salin kemarin</button>
      <button class="btn" data-action="saveTemplate" id="saveTemplateBtn">💾 Jadikan template</button>
    </div>
    <div class="card">
      <h3 class="card-title">📊 Ringkasan harian</h3>
      ${dailySummaryHtml(date)}
    </div>
    ${slots}
    <div class="card">
      <h3 class="card-title">💰 Ringkasan biaya</h3>
      <div class="cost-grid">
        ${costTile(`Minggu ini (${fmtDateShort(ws)}–${fmtDateShort(we)})`, wk.cost, wkBudget, wk.days, wk.cost > wkBudget ? '⚠️ Melebihi anggaran mingguan' : '✓ Sesuai anggaran')}
        ${costTile(`Bulan ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`, mo.cost, moBudget, mo.days, mo.cost > moBudget ? '⚠️ Melebihi anggaran bulanan' : '✓ Sesuai anggaran')}
      </div>
    </div>`;
}

function weightOptions(selected) {
  const list = [0, ...sortedDumbbells()];
  const sel = num(selected);
  if (!list.includes(sel)) list.push(sel);
  return list.sort((a, b) => a - b).map(w => `<option value="${w}" ${w === sel ? 'selected' : ''}>${w === 0 ? 'Tanpa beban' : w + ' kg'}</option>`).join('');
}

function sessionHtml() {
  const date = ui.gymDate, s = state.settings;
  const wid = getWorkoutForDate(date);
  const sess = getSessionView(date);
  const opts = Object.entries(state.program.workouts).map(([id, w]) => `<option value="${id}" ${id === wid ? 'selected' : ''}>${esc(w.name)} — ${esc(w.focus || '')}</option>`).join('') +
    `<option value="rest" ${!state.program.workouts[wid] ? 'selected' : ''}>Istirahat</option>`;
  const restOpts = [45, 60, 90, 120, 150, 180];
  if (!restOpts.includes(s.restSeconds)) restOpts.push(s.restSeconds);

  let html = dateNav(date, 'gym') + `
    <div class="card session-head">
      <div class="row wrap">
        <label class="grow" style="min-width:180px"><span class="muted small" style="font-weight:650">Latihan</span>
          <select class="input" data-change="gymWorkout" id="gymWorkoutSelect">${opts}</select></label>

          <select class="input" data-change="restQuick" id="restQuickSelect">${restOpts.sort((a, b) => a - b).map(v => `<option value="${v}" ${v === s.restSeconds ? 'selected' : ''}>${v} dtk</option>`).join('')}</select></label>
        <button class="btn btn-soft" style="align-self:flex-end" data-action="timerStart" id="timerStartBtn">⏱ Mulai</button>
      </div>
      ${sess ? (() => { const p = sessionProgress(sess); return `

          <div class="metric-head"><span class="metric-label">Progres sesi ${sess.completed ? '<span class="chip chip-ok">Selesai</span>' : ''}</span><span class="metric-val" id="sessProgText"><b>${p.done}</b> / ${p.total} set</span></div>
          <div class="bar bar-primary"><div class="bar-fill" id="sessProgFill" style="width:${p.total ? p.done / p.total * 100 : 0}%"></div></div>

  const thumbUrl = en.media || 'https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=200&auto=format&fit=crop&q=80';

  return `<div class="card ex-card ${done === en.sets.length ? 'complete' : ''}" id="ex-${i}">
    <div class="ex-top-row">
      <!-- Thumbnail Foto / Video -->
      <button type="button" class="ex-thumb-btn" data-action="openMovementGuide" data-ex="${i}" title="Lihat foto & video ${esc(en.name)}" aria-label="Lihat panduan gerakan">

      <div class="ex-title-side">
        <span class="chip ${done === en.sets.length ? 'chip-ok' : done ? 'chip-warn' : 'chip-muted'}" id="exc-${i}">${done}/${en.sets.length}</span>
        <button type="button" class="btn btn-sm btn-soft" data-action="openMovementGuide" data-ex="${i}" style="padding:4px 8px;font-size:.73rem">🎬 Panduan</button>
      </div>
    </div>
    ${prev ? `<div class="prev"><b>Sesi lalu · ${fmtDateDay(prev.date)}:</b> ${prev.entry.sets.filter(s => s.done).map(fmtSet).join(' · ')}
        ${prev.entry.note ? `<div class="prev-note">📝 ${esc(prev.entry.note)}</div>` : ''}</div>`
      : '<div class="prev">Belum ada data sesi sebelumnya — mulai dari batas bawah beban.</div>'}
    ${sug ? `<div class="suggest ${sug.weight ? '' : 'info'}">📈 <div><b>${sug.title}</b><br><span style="font-weight:500">${sug.text}</span></div></div>` : ''}
    <div class="sets">
      <div class="set-row set-head"><span>Set</span><span>Beban</span><span>${isTime ? 'Detik' : 'Rep'}${en.perSide ? '/' + en.perSide : ''}</span><span>✓</span></div>
      ${en.sets.map((s, j) => `

  </div>`;
}

function refreshSessionProgress(sess) {
  const p = sessionProgress(sess);
  const fill = $('#sessProgFill'), txt = $('#sessProgText');
  if (fill) fill.style.width = (p.total ? p.done / p.total * 100 : 0) + '%';
  if (txt) txt.innerHTML = `<b>${p.done}</b> / ${p.total} set`;
  sess.entries.forEach((en, i) => {
    const d = en.sets.filter(s => s.done).length, all = d === en.sets.length;
    const chip = $('#exc-' + i), card = $('#ex-' + i);
    if (chip) { chip.textContent = `${d}/${en.sets.length}`; chip.className = `chip ${all ? 'chip-ok' : d ? 'chip-warn' : 'chip-muted'}`; }
    if (card) card.classList.toggle('complete', all);
  });
  return p;
}

/* ---------- 8d. PROGRES ---------- */
function exerciseNames() {
  const set = new Set();
  Object.values(state.program.workouts).forEach(w => w.exercises.forEach(e => set.add(e.name)));
  Object.values(state.sessions).forEach(s => s.entries.forEach(e => set.add(e.name)));
  return [...set];
}
function chartCard(id, title, sub, extra = '') {
  return `<div class="card"><div class="card-head"><div><h3 class="card-title">${title}</h3><p class="muted small">${sub}</p></div>${extra}</div>

}

  const canvas = document.getElementById(id);
  if (!canvas) return;
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  const box = canvas.parentElement;
  box.querySelectorAll('.chart-empty').forEach(n => n.remove());
  if (typeof Chart === 'undefined') {
    box.insertAdjacentHTML('beforeend', '<div class="chart-empty">Grafik tidak dapat dimuat.<br>Periksa koneksi internet (Chart.js dari cdnjs).</div>');
    return;
  }
  if (!hasData) box.insertAdjacentHTML('beforeend', '<div class="chart-empty">Belum ada data untuk ditampilkan</div>');
  charts[id] = new Chart(canvas, config);
}

function gradientFill(color) {
  return ctx => {
    const { chart } = ctx, area = chart.chartArea;
    if (!area) return rgba(color, 0.15);
    const g = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
    g.addColorStop(0, rgba(color, 0.32)); g.addColorStop(1, rgba(color, 0));
    return g;
  };
}

function baseOptions(c, yExtra = {}) {
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { labels: { color: c.text, usePointStyle: true, boxWidth: 8, padding: 14 } },
      tooltip: { backgroundColor: isDark() ? '#eceefa' : '#141a2e', titleColor: isDark() ? '#141a2e' : '#fff', bodyColor: isDark() ? '#141a2e' : '#fff', padding: 10, cornerRadius: 10 },
    },
    scales: {
      x: { ticks: { color: c.text, maxRotation: 0, autoSkip: true, maxTicksLimit: 8 }, grid: { display: false } },
      y: { ticks: { color: c.text }, grid: { color: c.grid }, border: { display: false }, ...yExtra },
    },
  };
}
const lineDs = (label, data, color, extra = {}) => ({
  label, data, borderColor: rgba(color), backgroundColor: gradientFill(color), fill: true, tension: 0.35,
  pointRadius: 3.5, pointHoverRadius: 6, pointBackgroundColor: rgba(color), borderWidth: 2.5, spanGaps: true, ...extra,
});
const targetDs = (label, value, n, color, dash = [6, 6]) => ({
  label, data: Array(n).fill(value), borderColor: rgba(color, 0.9), borderDash: dash, pointRadius: 0, borderWidth: 2, fill: false, type: 'line',
});

function maxWeightSeries(name) {
  const labels = [], data = []; let unit = 'kg';
  Object.keys(state.sessions).sort().forEach(d => {
    state.sessions[d].entries.filter(e => e.name === name).forEach(e => {
      const done = e.sets.filter(s => s.done);
      if (!done.length) return;
      if (e.unit === 'detik') { unit = 'detik'; data.push(Math.max(...done.map(s => num(s.reps)))); }
      else data.push(Math.max(...done.map(s => num(s.weight))));
      labels.push(fmtDateShort(d));
    });
  });
  return { labels, data, unit };
}

function drawCharts() {
  const c = palette(), s = state.settings, today = todayStr();
  if (typeof Chart !== 'undefined') {
    Chart.defaults.font.family = "'Plus Jakarta Sans', system-ui, sans-serif";
    Chart.defaults.color = c.text;
  }
  const N = ui.chartRange;
  const days = Array.from({ length: N }, (_, i) => addDays(today, i - N + 1));
  const dayLabels = days.map(fmtDateShort);

  const logs = sortedLogs();
  makeChart('chartWeight', { type: 'line',
    data: { labels: logs.map(l => fmtDateShort(l.date)), datasets: [lineDs('Berat (kg)', logs.map(l => l.weight), c.primary)] },
    options: baseOptions(c, { suggestedMin: logs.length ? Math.min(...logs.map(l => l.weight)) - 1 : 50, suggestedMax: logs.length ? Math.max(...logs.map(l => l.weight)) + 1 : 60 }) }, logs.length > 0);

  if (document.getElementById('chartMeasure')) {
    const ml = logs.filter(l => l.arm || l.chest || l.thigh);
    const ds = (label, key, color) => lineDs(label, ml.map(l => l[key] || null), color, { fill: false });
    makeChart('chartMeasure', { type: 'line',
      data: { labels: ml.map(l => fmtDateShort(l.date)), datasets: [ds('Lengan', 'arm', c.primary), ds('Dada', 'chest', c.cyan), ds('Paha', 'thigh', c.pink)] },
      options: baseOptions(c) }, ml.length > 0);
  }

  const prot = days.map(d => hasMeals(d) ? round1(dayTotals(d).protein) : null);
  makeChart('chartProtein', { type: 'line',
    data: { labels: dayLabels, datasets: [
      lineDs('Protein (g)', prot, c.primary, { pointBackgroundColor: prot.map(v => v != null && v >= s.proteinMin ? rgba(c.ok) : rgba(c.warn)), pointRadius: 4.5 }),
      targetDs(`Ideal ${s.proteinTarget} g`, s.proteinTarget, N, c.ok),
      targetDs(`Minimal ${s.proteinMin} g`, s.proteinMin, N, c.warn, [2, 4]),
    ] },
    options: baseOptions(c, { suggestedMin: 0, suggestedMax: s.proteinMax }) }, prot.some(v => v != null));

  const kcal = days.map(d => hasMeals(d) ? Math.round(dayTotals(d).kcal) : null);
  makeChart('chartKcal', { type: 'line',
    data: { labels: dayLabels, datasets: [lineDs('Kalori (kkal)', kcal, c.cyan), targetDs(`Target ${fmtNum(s.calorieTarget)}`, s.calorieTarget, N, c.ok)] },
    options: baseOptions(c, { suggestedMin: 0, suggestedMax: s.calorieTarget * 1.2 }) }, kcal.some(v => v != null));

  drawMaxChart();

  const thisWeek = weekStart(today);
  const weeks = Array.from({ length: 8 }, (_, i) => addDays(thisWeek, (i - 7) * 7));
  const target = weeklySessionTarget();
  const sessCount = weeks.map(sessionsInWeek);
  makeChart('chartSessions', { type: 'bar',
    data: { labels: weeks.map(fmtDateShort), datasets: [
      { label: 'Sesi selesai', data: sessCount, backgroundColor: sessCount.map(v => v >= target ? rgba(c.ok, 0.85) : rgba(c.primary, 0.75)), borderRadius: 8, maxBarThickness: 34 },
      targetDs(`Target ${target}`, target, 8, c.warn),
    ] },
    options: baseOptions(c, { beginAtZero: true, suggestedMax: target + 1, ticks: { color: c.text, stepSize: 1 } }) }, true);

  const wkBudget = s.budget * 7;
  const costs = weeks.map(w => Math.round(rangeTotals(w, addDays(w, 6)).cost));
  const costOpts = baseOptions(c, { beginAtZero: true, ticks: { color: c.text, callback: v => fmtRpShort(v) } });
  costOpts.plugins.tooltip.callbacks = { label: ctx => `${ctx.dataset.label}: ${fmtRp(ctx.parsed.y)}` };
  makeChart('chartCost', { type: 'bar',
    data: { labels: weeks.map(fmtDateShort), datasets: [
      { label: 'Biaya makan', data: costs, backgroundColor: costs.map(v => v > wkBudget ? rgba(c.bad, 0.8) : rgba(c.cyan, 0.75)), borderRadius: 8, maxBarThickness: 34 },
      targetDs('Anggaran', wkBudget, 8, c.warn),
    ] },
    options: costOpts }, costs.some(v => v > 0));
}

function drawMaxChart() {
  const c = palette();
  const ser = maxWeightSeries(ui.chartExercise);
  makeChart('chartMax', { type: 'line',
    data: { labels: ser.labels, datasets: [lineDs(`${ui.chartExercise || ''} (${ser.unit})`, ser.data, c.pink, { stepped: false, pointRadius: 5 })] },
    options: baseOptions(c, { suggestedMin: 0, suggestedMax: ser.data.length ? Math.max(...ser.data) + (ser.unit === 'kg' ? 5 : 10) : 20 }) }, ser.data.length > 0);
}

  const changed = ui.page !== page;
  ui.page = page;
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
  $$('.tab').forEach(t => { const on = t.dataset.page === page; t.classList.toggle('active', on); on ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'); });
  renderCurrent();
  if (changed) window.scrollTo({ top: 0 });
}
function navigate(page) { if (location.hash !== '#' + page) location.hash = page; else go(page); }
function renderCurrent() {
  ({ dashboard: renderDashboard, makan: renderMeals, gym: renderGym, progres: renderProgress, pengaturan: renderSettings })[ui.page]();
}

function findMealEntry(id) {
  const list = state.meals[ui.mealDate] || [];
  return { list, idx: list.findIndex(e => e.id === id) };
}
function removeMealEntry(id) {
  const { list, idx } = findMealEntry(id);
  if (idx < 0) return;
  const [removed] = list.splice(idx, 1);
  const date = ui.mealDate;
  if (!list.length) delete state.meals[date];
  save(); renderMeals();
  toast(`${esc(removed.name)} dihapus`, '', { label: 'Batalkan', fn: () => {
    (state.meals[date] = state.meals[date] || []).splice(idx, 0, removed); save(); renderCurrent();
  } });
}
function applyTemplateTo(date) {
  const entries = [];
  MEAL_SLOTS.forEach(sl => (state.template[sl.id] || []).forEach(t => {
    const f = findFood(t.foodId);
    if (f) entries.push(makeMealEntry(f, sl.id, t.qty));
  }));
  state.meals[date] = entries;
  save();
  const t = dayTotals(date);
  toast(`⚡ Menu diterapkan: ${fmtNum(t.protein, 1)} g protein · ${fmtRp(t.cost)}`, 'ok');
}

    const w = state.program.workouts[el.dataset.wid], e = w.exercises.find(x => x.id === el.dataset.exid);
    if (!(await confirmDialog(`Hapus latihan "${esc(e.name)}" dari ${esc(w.name)}?`, { ok: 'Hapus', danger: true }))) return;
    w.exercises = w.exercises.filter(x => x.id !== e.id); ui.draft = null; save(); renderGym();
  },
  moveEx: el => {
    const list = state.program.workouts[el.dataset.wid].exercises, i = +el.dataset.idx, j = i + Number(el.dataset.dir);
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]]; ui.draft = null; save(); renderGym();
  },
  editWorkout: el => openWorkoutForm(el.dataset.wid),
  delWorkout: async el => {
    const wid = el.dataset.wid, w = state.program.workouts[wid];
    if (!(await confirmDialog(`Hapus hari latihan "${esc(w.name)}"? Jadwal yang memakainya akan menjadi istirahat. Riwayat sesi tetap tersimpan.`, { ok: 'Hapus', danger: true }))) return;
    delete state.program.workouts[wid];
    Object.keys(state.program.schedule).forEach(d => { if (state.program.schedule[d] === wid) state.program.schedule[d] = 'rest'; });
    ui.draft = null; save(); renderGym();
  },

  // Progres
  chartRange: el => { ui.chartRange = Number(el.dataset.value); renderProgress(); },
  delLog: async el => {
    if (!(await confirmDialog('Hapus catatan berat badan ini?', { ok: 'Hapus', danger: true }))) return;
    state.bodyLogs = state.bodyLogs.filter(l => l.id !== el.dataset.id); save(); renderProgress();
  },

  // Pengaturan
  setTheme: el => { state.settings.theme = el.dataset.value; save(); applyTheme(); renderSettings(); },
  exportData: () => {
    try {
      const blob = new Blob([JSON.stringify({ app: 'OtotKu', exportedAt: new Date().toISOString(), ...state }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ototku-backup-${todayStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('⬇️ Data diekspor', 'ok');
    } catch (err) { console.error(err); toast('Gagal mengekspor data', 'bad'); }
  },
  importData: () => $('#importFile').click(),
  clearSample: async () => {
    if (!(await confirmDialog('Hapus semua data contoh? Data yang Anda masukkan sendiri tetap aman.', { ok: 'Hapus data contoh', danger: true }))) return;
    removeSampleData(); renderSettings(); toast('🧹 Data contoh dihapus', 'ok');
  },
  loadSample: () => { generateSampleData(); save(); renderSettings(); toast('✨ Data contoh dimuat', 'ok'); },
  resetAll: async () => {
    if (!(await confirmDialog('Semua data (makan, gym, berat, pengaturan) akan dihapus permanen. Export dulu jika perlu. Lanjutkan?', { ok: 'Reset semua', danger: true }))) return;
    const theme = state.settings.theme;
    state = createDefaultState(); state.settings.theme = theme;
    ui.draft = null; ui.gymOverride = {};
    save(); applyTheme(); renderSettings(); toast('Data direset');
  },
};

const changes = {
  dateSet: el => { if (el.value) { ui[el.dataset.scope + 'Date'] = el.value; renderCurrent(); } },
  qtySet: el => {
    const v = round1(num(el.value));
    if (v <= 0) return removeMealEntry(el.dataset.id);
    const { list, idx } = findMealEntry(el.dataset.id); if (idx < 0) return;
    list[idx].qty = v; save(); renderMeals();
  },
  gymWorkout: async el => {
    const date = ui.gymDate, val = el.value, existing = state.sessions[date];
    if (existing) {
      const hasData = existing.entries.some(e => e.sets.some(s => s.done));
      if (hasData && !(await confirmDialog('Sesi ini sudah berisi data. Mengganti latihan akan menghapus data sesi tanggal ini. Lanjutkan?', { ok: 'Ganti', danger: true }))) { renderGym(); return; }
      delete state.sessions[date]; save();
    }
    ui.gymOverride[date] = val; ui.draft = null; renderGym();
  },
  restQuick: el => { state.settings.restSeconds = Number(el.value); save(); toast(`⏱ Timer istirahat: ${el.value} detik`); },
  toggleSet: el => {
    const i = +el.dataset.ex, j = +el.dataset.set;
    const sess = commitSession(ui.gymDate); if (!sess) return;
    const en = sess.entries[i], set = en.sets[j], row = el.closest('.set-row');
    set.done = el.checked;
    const w = row.querySelector('[data-field="weight"]'); if (w) set.weight = num(w.value);
    if (set.done && (set.reps === '' || set.reps == null)) {
      set.reps = en.repMin;
      const r = row.querySelector('[data-field="reps"]'); if (r) r.value = set.reps;
    }
    row.classList.toggle('done', set.done);
    save();
    const p = refreshSessionProgress(sess);
    if (set.done) {
      if (p.done === p.total) { Timer.stop(); toast('💪 Semua set selesai! Tekan "Selesaikan sesi".', 'ok'); }
      else Timer.start(state.settings.restSeconds);
    }
  },
  setField: el => {
    const sess = commitSession(ui.gymDate); if (!sess) return;
    const set = sess.entries[+el.dataset.ex].sets[+el.dataset.set];
    set[el.dataset.field] = el.dataset.field === 'weight' ? num(el.value) : (el.value === '' ? '' : Math.max(0, Math.round(num(el.value))));
    save();
  },
  exNote: el => { const sess = commitSession(ui.gymDate); if (sess) { sess.entries[+el.dataset.ex].note = el.value.trim(); save(); } },
  sessionNote: el => { const sess = commitSession(ui.gymDate); if (sess) { sess.notes = el.value.trim(); save(); } },
  schedule: el => { state.program.schedule[el.dataset.day] = el.value; ui.draft = null; save(); renderGym(); toast('📅 Jadwal diperbarui'); },
  chartExercise: el => { ui.chartExercise = el.value; drawMaxChart(); },
};

const inputs = {
  foodSearch: el => { $('#foodPickList').innerHTML = foodPickHtml(el.value); },
  weightRecalc: el => {
    const w = num(el.value), s = state.settings;
    if (w < 20) return;
    $('#setPMin').value = Math.round(w * s.proteinFactorMin);
    $('#setPMax').value = Math.round(w * s.proteinFactorMax);
    $('#setPTarget').value = Math.round(w * s.proteinFactorIdeal);
  },
};

const forms = {
  food: f => {
    const d = formData(f), name = (d.name || '').trim();
    if (!name) return toast('Nama makanan wajib diisi', 'warn');
    const food = { id: d.id || 'f_' + uid(), name, portion: (d.portion || '1 porsi').trim(),
      protein: num(d.protein), kcal: num(d.kcal), satFat: num(d.satFat), priceMin: num(d.priceMin), priceMax: num(d.priceMax) };
    const idx = state.foods.findIndex(x => x.id === food.id);
    if (idx >= 0) state.foods[idx] = { ...state.foods[idx], ...food }; else state.foods.push(food);
    save(); toast(`✓ ${esc(name)} disimpan`, 'ok');
    renderMeals();
    if (ui.foodFormFromAdd) openAddFood(ui.addSlot); else closeModal();
  },
  exercise: f => {
    const d = formData(f), w = state.program.workouts[d.wid];
    const name = (d.name || '').trim();
    if (!name) return toast('Nama latihan wajib diisi', 'warn');
    const repMin = Math.max(1, Math.round(num(d.repMin, 1))), wMin = num(d.wMin);
    const e = {
      id: d.exid || uid(), name, sets: Math.min(10, Math.max(1, Math.round(num(d.sets, 3)))),
      repMin, repMax: Math.max(repMin, Math.round(num(d.repMax, repMin))), unit: d.unit === 'detik' ? 'detik' : 'rep',
      perSide: d.perSide || '', wMin, wMax: Math.max(wMin, num(d.wMax)),
      target: (d.target || '').trim(), media: (d.media || '').trim(), video: (d.video || '').trim(),
      cues: (d.cues || '').trim(), mistakes: (d.mistakes || '').trim()
    };
    const idx = w.exercises.findIndex(x => x.id === e.id);
    if (idx >= 0) w.exercises[idx] = e; else w.exercises.push(e);
    ui.draft = null; save(); closeModal(); renderGym(); toast('✓ Latihan disimpan', 'ok');
  },
  workout: f => {
    const d = formData(f), name = (d.name || '').trim();
    if (!name) return toast('Nama wajib diisi', 'warn');
    if (d.wid) Object.assign(state.program.workouts[d.wid], { name, focus: (d.focus || '').trim() });
    else state.program.workouts['w_' + uid()] = { name, focus: (d.focus || '').trim(), exercises: [] };
    ui.draft = null; save(); closeModal(); renderGym(); toast('✓ Disimpan', 'ok');
  },
  bodyLog: f => {
    const d = formData(f), w = num(d.weight, NaN);
    if (!(w >= 20 && w <= 300)) return toast('Masukkan berat badan yang valid', 'warn');
    const opt = v => (v === '' || v == null) ? null : num(v);
    const log = { id: uid(), date: d.date || todayStr(), weight: round1(w), arm: opt(d.arm), chest: opt(d.chest), thigh: opt(d.thigh) };
    const idx = state.bodyLogs.findIndex(l => l.date === log.date);
    if (idx >= 0) state.bodyLogs[idx] = log; else state.bodyLogs.push(log);
    const latest = sortedLogs().pop();
    toast('⚖️ Berat badan tersimpan', 'ok');
    if (latest.id === log.id && log.weight !== state.settings.weight) applyWeight(log.weight, true);
    save(); renderProgress();
  },
  settings: f => {
    const d = formData(f), s = state.settings;
    const pMin = num(d.proteinMin), pT = num(d.proteinTarget), pMax = num(d.proteinMax);
    if (num(d.weight) < 20) return toast('Berat badan tidak valid', 'warn');
    if (!(pMin > 0 && pMin <= pT && pT <= pMax)) return toast('Pastikan protein min ≤ ideal ≤ maks', 'warn');
    const dbs = [...new Set(String(d.dumbbells).split(/[,;\s]+/).map(Number).filter(n => n > 0))].sort((a, b) => a - b);
    if (!dbs.length) return toast('Masukkan minimal satu ukuran dumbbell', 'warn');
    Object.assign(s, {
      weight: round1(num(d.weight)), goal: (d.goal || '').trim() || DEFAULT_SETTINGS.goal,
      proteinMin: Math.round(pMin), proteinTarget: Math.round(pT), proteinMax: Math.round(pMax),
      calorieTarget: Math.max(0, Math.round(num(d.calorieTarget))), satFatLimit: Math.max(0, num(d.satFatLimit)),
      budget: Math.max(0, Math.round(num(d.budget))), restSeconds: Math.max(5, Math.round(num(d.restSeconds, 90))), dumbbells: dbs,
    });
    ui.draft = null;
    if (save()) toast('✓ Pengaturan profil disimpan', 'ok');
    renderSettings();
  },
  cloudSettings: f => {
    const d = formData(f);
    const c = state.settings.cloud = state.settings.cloud || {};
    c.syncKey = (d.syncKey || '').trim() || 'default_user';
    c.supabaseUrl = (d.supabaseUrl || '').trim();
    c.supabaseKey = (d.supabaseKey || '').trim();
    c.firebaseConfig = (d.firebaseConfig || '').trim();
    c.enabled = !!f.querySelector('input[name="cloudEnabled"]')?.checked;
    c.autoSync = true;
    save();
    Cloud.setupClient();
    toast('☁️ Konfigurasi Cloud disimpan!', 'ok');
    if (c.enabled) {
      Cloud.push({ manual: true });
    }
    renderSettings();
  }
};

function handleImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch (err) { return toast('File bukan JSON yang valid', 'bad'); }
    if (!data || typeof data !== 'object' || !data.settings || !Array.isArray(data.foods)) return toast('Format data tidak dikenali', 'bad');
    if (!(await confirmDialog('Data saat ini akan diganti dengan isi file. Lanjutkan impor?', { ok: 'Impor' }))) return;
    delete data.app; delete data.exportedAt;
    state = normalizeState(data);
    ui.draft = null; ui.gymOverride = {};
    save(); applyTheme(); renderCurrent(); toast('⬆️ Data berhasil diimpor', 'ok');
  };
  reader.onerror = () => toast('Gagal membaca file', 'bad');
  reader.readAsText(file);
}

function bindEvents() {
  document.addEventListener('click', e => {
    if (e.target.matches('.date-display input[type="date"]')) { try { e.target.showPicker(); } catch (err) { } }
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-change]');
    if (el && changes[el.dataset.change]) changes[el.dataset.change](el, e);
  });
  document.addEventListener('input', e => {
    const el = e.target.closest('[data-input]');
    if (el && inputs[el.dataset.input]) inputs[el.dataset.input](el, e);
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    if (forms[f.dataset.form]) forms[f.dataset.form](f);
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
  $('#importFile').addEventListener('change', e => { handleImport(e.target.files[0]); e.target.value = ''; });
  window.addEventListener('hashchange', () => go(location.hash.slice(1)));
  if (darkQuery) {
    const onScheme = () => { if (state.settings.theme === 'auto') { applyTheme(); renderCurrent(); } };
    darkQuery.addEventListener ? darkQuery.addEventListener('change', onScheme) : darkQuery.addListener(onScheme);
  }
}

function init() {
  const saved = Store.load();
  if (saved) {
    state = normalizeState(saved);
  } else {
    state = createDefaultState();
    generateSampleData();
    Store.saveLocal();
  }
  applyTheme();
  bindEvents();
  Cloud.init();
  go(location.hash.slice(1) || 'dashboard');

  // Registrasi Service Worker untuk PWA & Caching Offline
  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.warn('PWA ServiceWorker error:', err);
      });
    });
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
