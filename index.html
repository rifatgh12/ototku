/* ---------- 8b. MAKAN & CREATINE ---------- */
function renderMeals() {
  const viewHtml = ui.mealTab === 'db'
    ? foodDbHtml()
    : ui.mealTab === 'creatine'
      ? creatineTrackerPageHtml()
      : mealLogHtml();
  $('#page-makan').innerHTML =
    pageHead('Makan & Suplemen', 'Catat asupan makanan, creatine harian & hidrasi', seg([['log', 'Catatan'], ['creatine', '⚡ Creatine'], ['db', 'Database']], ui.mealTab, 'mealTab')) +
    viewHtml;
}

function creatineTrackerPageHtml() {
  const date = ui.mealDate, s = state.settings;
  const target = s.creatineTarget || 5;
  const sat = creatineSaturationStats(date);
  const cStreak = creatineStreak(), cBest = bestCreatineStreak();

  // Kalender kepatuhan 28 hari (4 minggu terakhir berakhir di minggu ini)
  const endWeek = addDays(weekStart(date), 6);
  const start28 = addDays(endWeek, -27);
  const calCells = Array.from({ length: 28 }, (_, i) => {
    const d = addDays(start28, i);
    const cg = getCreatine(d).grams;
    const isHit = cg >= target;
    const isPart = cg > 0 && cg < target;
    const isSel = d === date;
    const dt = parseDate(d);
    return `<button type="button" class="creatine-day ${isHit ? 'done' : isPart ? 'partial' : ''} ${isSel ? 'today' : ''}" data-action="creatineDayTap" data-date="${d}" title="${fmtDateLong(d)}: ${cg}g creatine">
      <span>${dt.getDate()} ${MONTH_NAMES[dt.getMonth()].slice(0, 3)}</span>
      <span class="dot">${isHit ? '✓' : isPart ? fmtNum(cg, 0) : '·'}</span>
      <span style="font-size:.62rem;color:${isHit ? 'var(--ok)' : 'var(--muted)'}">${cg > 0 ? `${fmtNum(cg, 1)}g` : '0g'}</span>
    </button>`;
  }).join('');

  return dateNav(date, 'meal') + `
    <div class="stats">
      <div class="stat"><div class="stat-ico">⚡</div><div class="stat-val">${cStreak}<small> hari</small></div><div class="stat-lbl">Streak Creatine · terbaik ${cBest}</div></div>
      <div class="stat"><div class="stat-ico">🔋</div><div class="stat-val">${sat.saturationPct}<small>%</small></div><div class="stat-lbl">Saturasi Otot · ${sat.statusShort}</div></div>
      <div class="stat"><div class="stat-ico">📅</div><div class="stat-val">${sat.daysHit30}<small>/30</small></div><div class="stat-lbl">Hari patuh (30 hr)</div></div>
      <div class="stat"><div class="stat-ico">🥄</div><div class="stat-val">${fmtNum(sat.totalGrams30, 0)}<small> g</small></div><div class="stat-lbl">Total 30 hari (~${Math.round(sat.totalGrams30 / 5)} scoop)</div></div>
    </div>

    ${creatineCardHtml(date, { scope: 'tab', showProtocol: true })}

    <div class="card">
      <div class="card-head">
        <div>
          <h3 class="card-title">🗓️ Riwayat & Kalender Creatine (28 Hari)</h3>
          <p class="muted small">Ketuk tanggal mana pun untuk langsung menandai sudah minum (${target} g) atau mengosongkan.</p>
        </div>
        <span class="chip chip-ok">✓ Target ${target} g/hari</span>
      </div>
      <div class="creatine-cal-grid" role="group" aria-label="Kalender creatine 28 hari">
        ${calCells}
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">💡 Panduan Ilmiah Creatine Monohydrate</h3>
      <ul class="list" style="margin-top:6px">
        <li><span><b>⚡ Dosis Maintenance (3–5 g/hari)</b><br><span class="muted small">1 scoop setiap hari (termasuk hari istirahat) menjaga cadangan fosfokreatin otot tetap 100% penuh.</span></span></li>
        <li><span><b>🚀 Fase Loading Opsional (20 g/hari · 5–7 hari)</b><br><span class="muted small">Bagi 4×5 g (Pagi, Siang, Sore, Malam) selama seminggu pertama untuk menjenuhkan otot 4× lebih cepat.</span></span></li>
        <li><span><b>💧 Hidrasi Intraseluler</b><br><span class="muted small">Creatine menarik air ke dalam sel otot (volumisasi sel). Pastikan minum minimal ${s.waterTarget || 10} gelas air per hari.</span></span></li>
        <li><span><b>🕒 Kapan Waktu Terbaik?</b><br><span class="muted small">Konsistensi harian adalah kunci utama. Mengonsumsinya setelah latihan bersama karbohidrat & protein sedikit membantu penyerapan insulin.</span></span></li>
      </ul>
    </div>`;
}

function mealLogHtml() {
  const date = ui.mealDate, list = state.meals[date] || [], s = state.settings;
  const quickFoods = state.foods.slice(0, 6);

  const slots = MEAL_SLOTS.map(sl => {
    const items = list.filter(e => e.slot === sl.id);
    const tot = sumEntries(items);
    const quickBar = quickFoods.length ? `<div class="slot-quick" aria-label="Tambah cepat ke ${sl.label}">
      <span class="slot-quick-lbl">⚡ Cepat:</span>
      ${quickFoods.map(f => `<button type="button" class="sq-pill" data-action="quickAddFood" data-date="${date}" data-slot="${sl.id}" data-id="${f.id}" data-qty="1">+ ${esc(f.name)} <span class="muted">(${fmtNum(f.protein, 1)}g)</span></button>`).join('')}
    </div>` : '';

    return `<div class="card">
      <div class="slot-head">
        <div class="slot-icon">${sl.icon}</div>
        <div class="grow"><h3>${sl.label} <span class="muted small" style="font-weight:500">${sl.time}</span></h3>
          <div class="slot-tot">${fmtNum(tot.protein, 1)} g protein · ${fmtNum(tot.kcal)} kkal · ${fmtRp(tot.cost)}</div></div>
        <button class="btn btn-sm btn-primary" data-action="openAddFood" data-slot="${sl.id}" id="add-${sl.id}">+ Pilih Menu</button>
      </div>
      ${quickBar}
      ${items.length ? `<ul class="entry-list">${items.map(e => `
        <li class="entry">
          <div class="entry-main">
            <div class="entry-name">${esc(e.name)} <span class="muted small" style="font-weight:500">· ${esc(e.portion || '')}</span></div>
            <div class="entry-meta">${fmtNum(e.protein * e.qty, 1)} g P · ${fmtNum(e.kcal * e.qty)} kkal · ${fmtNum(e.satFat * e.qty, 1)} g LJ · ${fmtRp(e.price * e.qty)}</div>
          </div>
          <div class="stepper">
            <button type="button" data-action="qtyStep" data-id="${e.id}" data-d="-1" aria-label="Kurangi">−</button>
            <input type="number" min="0" step="0.5" inputmode="decimal" value="${e.qty}" data-change="qtySet" data-id="${e.id}" aria-label="Jumlah porsi">
            <button type="button" data-action="qtyStep" data-id="${e.id}" data-d="1" aria-label="Tambah">+</button>
          </div>
          <button class="btn-icon ghost" data-action="delEntry" data-id="${e.id}" aria-label="Hapus">🗑️</button>
        </li>`).join('')}</ul>` : '<p class="empty-sm mt">Belum ada catatan untuk waktu ini. Ketuk tombol cepat di atas atau "+ Pilih Menu".</p>'}
    </div>`;
  }).join('');

  const ws = weekStart(date), we = addDays(ws, 6);
  const wk = rangeTotals(ws, we), wkBudget = s.budget * 7;
  const d = parseDate(date), ms = toDateStr(new Date(d.getFullYear(), d.getMonth(), 1));
  const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const me = toDateStr(new Date(d.getFullYear(), d.getMonth(), daysInMonth));
  const mo = rangeTotals(ms, me), moBudget = s.budget * daysInMonth;
  const costTile = (lbl, val, budget, days, sub) => {
    const st = statusLimit(val, budget);
    return `<div class="cost-tile"><div class="lbl">${lbl}</div><div class="val">${fmtRp(val)}</div>
      <div class="bar bar-${st}"><div class="bar-fill" style="width:${Math.min(100, budget ? val / budget * 100 : 0)}%"></div></div>
      <div class="metric-sub">dari anggaran ${fmtRp(budget)} · ${days} hari tercatat${days ? ` · rata-rata ${fmtRp(val / days)}/hari` : ''}</div>
      <div class="metric-sub">${sub}</div></div>`;
  };

  return dateNav(date, 'meal') + `
    <div class="quick-actions">
      <button class="btn btn-primary" data-action="applyTemplate" id="applyTemplateBtn">⚡ Terapkan "Menu Harian Saya"</button>
      <button class="btn" data-action="copyYesterday" id="copyYesterdayBtn">📋 Salin kemarin</button>
      <button class="btn" data-action="saveTemplate" id="saveTemplateBtn">💾 Jadikan template</button>
    </div>
    ${proteinGapBannerHtml(date)}
    ${creatineCardHtml(date, { scope: 'meal' })}
    <div class="card">
      <h3 class="card-title">📊 Ringkasan harian</h3>
      ${dailySummaryHtml(date)}
    </div>
    ${slots}
    <div class="card">
      <h3 class="card-title">💰 Ringkasan biaya</h3>
      <div class="cost-grid">
        ${costTile(`Minggu ini (${fmtDateShort(ws)}–${fmtDateShort(we)})`, wk.cost, wkBudget, wk.days, wk.cost > wkBudget ? '⚠️ Melebihi anggaran mingguan' : '✓ Sesuai anggaran')}
        ${costTile(`Bulan ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`, mo.cost, moBudget, mo.days, mo.cost > moBudget ? '⚠️ Melebihi anggaran bulanan' : '✓ Sesuai anggaran')}
      </div>
    </div>`;
}

function foodPickHtml(q = '') {
  const items = state.foods.filter(f => f.name.toLowerCase().includes(q.toLowerCase().trim()));
  if (!items.length) return '<p class="empty-sm">Tidak ditemukan. Buat makanan baru di bawah.</p>';
  const dayList = state.meals[ui.mealDate] || [];
  return items.map(f => {
    const inSlot = dayList.filter(e => e.foodId === f.id && e.slot === ui.addSlot).reduce((s, e) => s + e.qty, 0);
    return `
    <button type="button" class="food-item" data-action="addFood" data-id="${f.id}">
      <div class="fi-main">
        <b>${esc(f.name)} ${inSlot > 0 ? `<span class="chip chip-ok">✓ ${fmtNum(inSlot, 1)}×</span>` : ''}</b>
        <span>${esc(f.portion)} · <strong style="color:var(--primary)">${fmtNum(f.protein, 1)} g P</strong> · ${fmtNum(f.kcal)} kkal · ${foodPriceText(f)}</span>
      </div>
      <span class="fi-add">+</span>
    </button>`;
  }).join('');
}

function openAddFood(slot) {
  ui.addSlot = slot;
  const sl = MEAL_SLOTS.find(x => x.id === slot);
  openModal({
    title: `${sl.icon} Tambah ke ${sl.label}`,
    body: `<input class="input" type="search" placeholder="Cari makanan…" data-input="foodSearch" id="foodSearch" autocomplete="off">
      <div class="food-pick" id="foodPickList">${foodPickHtml()}</div>
      <p class="small muted mb">Ketuk makanan untuk langsung menambah +1 porsi ke waktu ${sl.label}.</p>
      <button type="button" class="btn btn-block btn-soft" data-action="openFoodForm" data-from-add="1" id="addNewFoodBtn">+ Buat makanan baru</button>`,
    foot: '<button class="btn btn-primary" data-action="closeModal" type="button" id="addFoodDone">Selesai</button>',
  });
}

function openFoodForm(id, fromAdd = false) {

}

function weightOptions(selected) {
  const list = [0, ...sortedDumbbells()];
  const sel = num(selected);
  if (!list.includes(sel)) list.push(sel);
  return list.sort((a, b) => a - b).map(w => `<option value="${w}" ${w === sel ? 'selected' : ''}>${w === 0 ? 'Tanpa beban' : w + ' kg'}</option>`).join('');
}

function sessionHtml() {
  const date = ui.gymDate, s = state.settings;
  const wid = getWorkoutForDate(date);

  const opts = Object.entries(state.program.workouts).map(([id, w]) => `<option value="${id}" ${id === wid ? 'selected' : ''}>${esc(w.name)} — ${esc(w.focus || '')}</option>`).join('') +
    `<option value="rest" ${!state.program.workouts[wid] ? 'selected' : ''}>Istirahat</option>`;
  const restOpts = [45, 60, 90, 120, 150, 180];
  if (!restOpts.includes(s.restSeconds)) restOpts.push(s.restSeconds);

  let html = dateNav(date, 'gym') + `
    <div class="card session-head">
      <div class="row wrap">
        <label class="grow" style="min-width:170px"><span class="muted small" style="font-weight:650">Latihan</span>
          <select class="input input-sm" data-change="gymWorkout" id="gymWorkoutSelect">${opts}</select></label>
        <label><span class="muted small" style="font-weight:650">Istirahat</span>
          <select class="input input-sm" data-change="restQuick" id="restQuickSelect">${restOpts.sort((a, b) => a - b).map(v => `<option value="${v}" ${v === s.restSeconds ? 'selected' : ''}>${v} dtk</option>`).join('')}</select></label>
        <button class="btn btn-sm btn-soft" style="align-self:flex-end;height:38px" data-action="timerStart" id="timerStartBtn">⏱ Timer</button>

        <div class="metric mt" style="margin-top:10px">
          <div class="metric-head">
            <span class="metric-label">Progres sesi ${sess.completed ? '<span class="chip chip-ok">✓ Selesai</span>' : ''} <span class="chip chip-primary" id="sessVolChip">🔥 ${fmtNum(p.volume)} kg</span></span>
            <span class="metric-val" id="sessProgText"><b>${p.done}</b> / ${p.total} set</span>

  if (!sess) {

    return html + `<div class="card rest-card"><span class="big-emoji">🧘</span><h3>Hari istirahat</h3>
      <p class="muted small mt">Pemulihan adalah bagian penting dari pertumbuhan otot. Jalan santai, peregangan ringan, tidur cukup, dan tetap penuhi protein.</p>
      ${nx ? `<p class="hint mt">Latihan berikutnya: <b>${esc(nx.w.name)}</b> — ${fmtDateDay(nx.date)}</p>` : ''}
      <p class="small muted">Ingin tetap latihan? Pilih latihan pada menu di atas.</p></div>`;

  html += sess.entries.map((en, i) => exerciseCardHtml(en, i, date)).join('');
  html += `<div class="card">
      <label class="field"><span>📝 Catatan sesi</span>
        <textarea class="input" rows="3" data-change="sessionNote" id="sessionNote" placeholder="Energi, kualitas tidur, keluhan, dll.">${esc(sess.notes)}</textarea></label>
      <button class="btn ${sess.completed ? '' : 'btn-primary'} btn-block" data-action="finishSession" id="finishSessionBtn">${sess.completed ? '↺ Tandai belum selesai' : '✓ Selesaikan sesi'}</button>
    </div>`;
  return html;
}

function exerciseCardHtml(en, i, date) {

  const done = en.sets.filter(s => s.done).length;

  const range = en.repMin === en.repMax ? `${en.repMin}` : `${en.repMin}-${en.repMax}`;
  const fmtSet = s => num(s.weight) > 0 ? `${s.weight}kg×${s.reps}` : `${s.reps}${isTime ? ' dtk' : ''}`;
  const thumbUrl = en.media || 'https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=200&auto=format&fit=crop&q=80';

  return `<div class="card ex-card ${done === en.sets.length ? 'complete' : ''}" id="ex-${i}">
    <div class="ex-top-row">
      <!-- Thumbnail Foto / Video -->
      <button type="button" class="ex-thumb-btn" data-action="openMovementGuide" data-ex="${i}" title="Lihat foto & video ${esc(en.name)}" aria-label="Lihat panduan gerakan">
        <img class="ex-thumb-img" src="${esc(thumbUrl)}" alt="${esc(en.name)}" loading="lazy">
        <span class="ex-thumb-play">▶</span>
      </button>
      <div class="ex-title-info">
        <h3>${esc(en.name)}</h3>
        <div class="ex-target">🎯 ${targetText(en)} · ${weightText(en)}</div>
      </div>
      <div class="ex-title-side">
        <span class="chip ${done === en.sets.length ? 'chip-ok' : done ? 'chip-warn' : 'chip-muted'}" id="exc-${i}">${done}/${en.sets.length}</span>
        <button type="button" class="btn btn-sm btn-soft" data-action="openMovementGuide" data-ex="${i}" style="padding:4px 8px;font-size:.73rem">🎬 Panduan</button>
      </div>
    </div>
    ${prev ? `<div class="prev"><b>Sesi lalu · ${fmtDateDay(prev.date)}:</b> ${prev.entry.sets.filter(s => s.done).map(fmtSet).join(' · ')}
        ${prev.entry.note ? `<div class="prev-note">📝 ${esc(prev.entry.note)}</div>` : ''}</div>`
      : '<div class="prev">Belum ada data sesi sebelumnya — mulai dari batas bawah beban.</div>'}
    ${sug ? `<div class="suggest ${sug.weight ? '' : 'info'}">📈 <div><b>${sug.title}</b><br><span style="font-weight:500">${sug.text}</span></div></div>` : ''}
    <div class="sets">
      <div class="set-row set-head"><span>Set</span><span>Beban</span><span>${isTime ? 'Detik' : 'Rep'}${en.perSide ? '/' + en.perSide : ''}</span><span>✓</span></div>
      ${en.sets.map((s, j) => `
        <div class="set-row ${s.done ? 'done' : ''}">
          <span class="set-no">${j + 1}</span>
          <select class="input input-sm" data-change="setField" data-ex="${i}" data-set="${j}" data-field="weight" aria-label="Beban set ${j + 1}">${weightOptions(s.weight)}</select>
          <div class="rep-box">
            <button type="button" data-action="repStep" data-ex="${i}" data-set="${j}" data-d="${isTime ? -5 : -1}" aria-label="Kurangi">−</button>
            <input type="number" min="0" inputmode="numeric" placeholder="${range}" value="${s.reps}" data-change="setField" data-ex="${i}" data-set="${j}" data-field="reps" aria-label="Repetisi set ${j + 1}">
            <button type="button" data-action="repStep" data-ex="${i}" data-set="${j}" data-d="${isTime ? 5 : 1}" aria-label="Tambah">+</button>
          </div>
          <label class="check"><input type="checkbox" ${s.done ? 'checked' : ''} data-change="toggleSet" data-ex="${i}" data-set="${j}" aria-label="Set ${j + 1} selesai"><span></span></label>
        </div>`).join('')}

    <div class="ex-foot-bar">
      <div class="row" style="gap:6px">
        <button type="button" class="btn btn-sm" data-action="addSet" data-ex="${i}">+ Set</button>
        ${en.sets.length > 1 ? `<button type="button" class="btn btn-sm" data-action="removeSet" data-ex="${i}">− Set</button>` : ''}
      </div>
      ${done < en.sets.length ? `<button type="button" class="btn btn-sm btn-soft" data-action="completeAllSets" data-ex="${i}">✓ Selesai Semua Set</button>` : `<span class="chip chip-ok">Semua set tuntas 💪</span>`}
    </div>
    <input class="input input-sm mt" placeholder="Catatan latihan (opsional)" value="${esc(en.note)}" data-change="exNote" data-ex="${i}" aria-label="Catatan ${esc(en.name)}">
  </div>`;
}

function refreshSessionProgress(sess) {
  const p = sessionProgress(sess);
  const fill = $('#sessProgFill'), txt = $('#sessProgText'), vol = $('#sessVolChip');
  if (fill) fill.style.width = (p.total ? p.done / p.total * 100 : 0) + '%';
  if (txt) txt.innerHTML = `<b>${p.done}</b> / ${p.total} set`;
  if (vol) vol.textContent = `🔥 ${fmtNum(p.volume)} kg`;
  sess.entries.forEach((en, i) => {
    const d = en.sets.filter(s => s.done).length, all = d === en.sets.length;
    const chip = $('#exc-' + i), card = $('#ex-' + i);
    if (chip) { chip.textContent = `${d}/${en.sets.length}`; chip.className = `chip ${all ? 'chip-ok' : d ? 'chip-warn' : 'chip-muted'}`; }
    if (card) card.classList.toggle('complete', all);
  });
  updateTabBadges();
  return p;
}

  return [...set];
}

/* =========================================================
   9. GRAFIK (Chart.js)
   ========================================================= */
const charts = {};
const palette = () => PALETTE[isDark() ? 'dark' : 'light'];

function makeChart(id, config, hasData = true) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  const box = canvas.parentElement;
  box.querySelectorAll('.chart-empty').forEach(n => n.remove());
  if (typeof Chart === 'undefined') {
    box.insertAdjacentHTML('beforeend', '<div class="chart-empty">Grafik tidak dapat dimuat.<br>Periksa koneksi internet (Chart.js dari cdnjs).</div>');
    return;
  }
  if (!hasData) box.insertAdjacentHTML('beforeend', '<div class="chart-empty">Belum ada data untuk ditampilkan</div>');
  charts[id] = new Chart(canvas, config);
}

function gradientFill(color) {
  return ctx => {
    const { chart } = ctx, area = chart.chartArea;
    if (!area) return rgba(color, 0.15);
    const g = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
    g.addColorStop(0, rgba(color, 0.32)); g.addColorStop(1, rgba(color, 0));
    return g;
  };
}

function baseOptions(c, yExtra = {}) {
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { labels: { color: c.text, usePointStyle: true, boxWidth: 8, padding: 14 } },
      tooltip: { backgroundColor: isDark() ? '#111116' : '#09090d', titleColor: '#f8fafc', bodyColor: '#e2e8f0', borderColor: 'rgba(244,63,94,0.35)', borderWidth: 1, padding: 11, cornerRadius: 10 },
    },
    scales: {
      x: { ticks: { color: c.text, maxRotation: 0, autoSkip: true, maxTicksLimit: 8 }, grid: { display: false } },
      y: { ticks: { color: c.text }, grid: { color: c.grid }, border: { display: false }, ...yExtra },
    },
  };
}
const lineDs = (label, data, color, extra = {}) => ({
  label, data, borderColor: rgba(color), backgroundColor: gradientFill(color), fill: true, tension: 0.35,
  pointRadius: 3.5, pointHoverRadius: 6, pointBackgroundColor: rgba(color), borderWidth: 2.5, spanGaps: true, ...extra,
});
const targetDs = (label, value, n, color, dash = [6, 6]) => ({
  label, data: Array(n).fill(value), borderColor: rgba(color, 0.9), borderDash: dash, pointRadius: 0, borderWidth: 2, fill: false, type: 'line',
});

function maxWeightSeries(name) {
  const labels = [], data = []; let unit = 'kg';
  Object.keys(state.sessions).sort().forEach(d => {
    state.sessions[d].entries.filter(e => e.name === name).forEach(e => {
      const done = e.sets.filter(s => s.done);
      if (!done.length) return;
      if (e.unit === 'detik') { unit = 'detik'; data.push(Math.max(...done.map(s => num(s.reps)))); }
      else data.push(Math.max(...done.map(s => num(s.weight))));
      labels.push(fmtDateShort(d));
    });
  });
  return { labels, data, unit };
}

function drawCharts() {
  const c = palette(), s = state.settings, today = todayStr();
  if (typeof Chart !== 'undefined') {
    Chart.defaults.font.family = "'Plus Jakarta Sans', system-ui, sans-serif";
    Chart.defaults.color = c.text;
  }
  const N = ui.chartRange;
  const days = Array.from({ length: N }, (_, i) => addDays(today, i - N + 1));
  const dayLabels = days.map(fmtDateShort);

  const logs = sortedLogs();
  makeChart('chartWeight', { type: 'line',
    data: { labels: logs.map(l => fmtDateShort(l.date)), datasets: [lineDs('Berat (kg)', logs.map(l => l.weight), c.primary)] },
    options: baseOptions(c, { suggestedMin: logs.length ? Math.min(...logs.map(l => l.weight)) - 1 : 50, suggestedMax: logs.length ? Math.max(...logs.map(l => l.weight)) + 1 : 60 }) }, logs.length > 0);

  if (document.getElementById('chartMeasure')) {
    const ml = logs.filter(l => l.arm || l.chest || l.thigh);
    const ds = (label, key, color) => lineDs(label, ml.map(l => l[key] || null), color, { fill: false });
    makeChart('chartMeasure', { type: 'line',
      data: { labels: ml.map(l => fmtDateShort(l.date)), datasets: [ds('Lengan', 'arm', c.primary), ds('Dada', 'chest', c.cyan), ds('Paha', 'thigh', c.pink)] },
      options: baseOptions(c) }, ml.length > 0);
  }

  const prot = days.map(d => hasMeals(d) ? round1(dayTotals(d).protein) : null);
  makeChart('chartProtein', { type: 'line',
    data: { labels: dayLabels, datasets: [
      lineDs('Protein (g)', prot, c.primary, { pointBackgroundColor: prot.map(v => v != null && v >= s.proteinMin ? rgba(c.ok) : rgba(c.warn)), pointRadius: 4.5 }),
      targetDs(`Ideal ${s.proteinTarget} g`, s.proteinTarget, N, c.ok),
      targetDs(`Minimal ${s.proteinMin} g`, s.proteinMin, N, c.warn, [2, 4]),
    ] },
    options: baseOptions(c, { suggestedMin: 0, suggestedMax: s.proteinMax }) }, prot.some(v => v != null));

  if (document.getElementById('chartCreatine')) {
    const cTarget = s.creatineTarget || 5;
    const creat = days.map(d => getCreatine(d).grams);
    makeChart('chartCreatine', { type: 'bar',
      data: { labels: dayLabels, datasets: [
        { label: 'Creatine (g)', data: creat, backgroundColor: creat.map(v => v >= cTarget ? rgba(c.ok, 0.85) : v > 0 ? rgba(c.warn, 0.8) : rgba(c.primary, 0.25)), borderRadius: 6, maxBarThickness: 28 },
        targetDs(`Target ${cTarget} g`, cTarget, N, c.cyan),
      ] },
      options: baseOptions(c, { beginAtZero: true, suggestedMax: Math.max(cTarget + 2, 7) }) }, creat.some(v => v > 0));
  }

  const kcal = days.map(d => hasMeals(d) ? Math.round(dayTotals(d).kcal) : null);
  makeChart('chartKcal', { type: 'line',
    data: { labels: dayLabels, datasets: [lineDs('Kalori (kkal)', kcal, c.cyan), targetDs(`Target ${fmtNum(s.calorieTarget)}`, s.calorieTarget, N, c.ok)] },
    options: baseOptions(c, { suggestedMin: 0, suggestedMax: s.calorieTarget * 1.2 }) }, kcal.some(v => v != null));

  drawMaxChart();

  const thisWeek = weekStart(today);
  const weeks = Array.from({ length: 8 }, (_, i) => addDays(thisWeek, (i - 7) * 7));
  const target = weeklySessionTarget();
  const sessCount = weeks.map(sessionsInWeek);
  makeChart('chartSessions', { type: 'bar',
    data: { labels: weeks.map(fmtDateShort), datasets: [
      { label: 'Sesi selesai', data: sessCount, backgroundColor: sessCount.map(v => v >= target ? rgba(c.ok, 0.85) : rgba(c.primary, 0.75)), borderRadius: 8, maxBarThickness: 34 },
      targetDs(`Target ${target}`, target, 8, c.warn),
    ] },
    options: baseOptions(c, { beginAtZero: true, suggestedMax: target + 1, ticks: { color: c.text, stepSize: 1 } }) }, true);

  const wkBudget = s.budget * 7;
  const costs = weeks.map(w => Math.round(rangeTotals(w, addDays(w, 6)).cost));
  const costOpts = baseOptions(c, { beginAtZero: true, ticks: { color: c.text, callback: v => fmtRpShort(v) } });
  costOpts.plugins.tooltip.callbacks = { label: ctx => `${ctx.dataset.label}: ${fmtRp(ctx.parsed.y)}` };
  makeChart('chartCost', { type: 'bar',
    data: { labels: weeks.map(fmtDateShort), datasets: [
      { label: 'Biaya makan', data: costs, backgroundColor: costs.map(v => v > wkBudget ? rgba(c.bad, 0.8) : rgba(c.cyan, 0.75)), borderRadius: 8, maxBarThickness: 34 },
      targetDs('Anggaran', wkBudget, 8, c.warn),
    ] },
    options: costOpts }, costs.some(v => v > 0));
}

function drawMaxChart() {
  const c = palette();
  const ser = maxWeightSeries(ui.chartExercise);
  makeChart('chartMax', { type: 'line',
    data: { labels: ser.labels, datasets: [lineDs(`${ui.chartExercise || ''} (${ser.unit})`, ser.data, c.pink, { stepped: false, pointRadius: 5 })] },
    options: baseOptions(c, { suggestedMin: 0, suggestedMax: ser.data.length ? Math.max(...ser.data) + (ser.unit === 'kg' ? 5 : 10) : 20 }) }, ser.data.length > 0);
}

function updateTabBadges() {
  const today = todayStr(), s = state.settings;
  const t = dayTotals(today);
  const sess = state.sessions[today];
  const wid = scheduledWorkoutId(today);
  const setBadge = (page, text, cls) => {
    $$(`.tab[data-page="${page}"]`).forEach(tab => {
      let b = tab.querySelector('.tab-badge');
      if (!text) { if (b) b.remove(); return; }
      if (!b) { b = document.createElement('span'); tab.appendChild(b); }
      b.className = 'tab-badge' + (cls ? ' ' + cls : '');
      b.textContent = text;
    });
  };
  if (t.protein >= s.proteinMin) setBadge('makan', '✓', 'ok');
  else if (hasMeals(today)) setBadge('makan', `${Math.round(pct(t.protein, s.proteinTarget))}%`, '');
  else setBadge('makan', '', '');

  if (sess?.completed) setBadge('gym', '✓', 'ok');
  else if (wid !== 'rest' && state.program.workouts[wid]) {
    const p = sess ? sessionProgress(sess) : { done: 0, total: 0 };
    setBadge('gym', p.done > 0 ? `${p.done}/${p.total}` : '!', '');
  } else setBadge('gym', '', '');

  const crToday = getCreatine(today), cTarget = s.creatineTarget || 5;
  const crBtn = $('#creatineHeaderBadge'), crTxt = $('#creatineHeaderText');
  if (crBtn && crTxt) {
    const crDone = crToday.grams >= cTarget;
    crBtn.classList.toggle('done', crDone);
    crTxt.textContent = crDone ? `${fmtNum(crToday.grams, 0)}g ✓` : `${fmtNum(crToday.grams, 0)}/${cTarget}g`;
  }
  const cm = $('#creatineModalContainer');
  if (cm) cm.innerHTML = creatineCardHtml(today, { scope: 'modal', showProtocol: true });
}

function go(page) {
  if (!PAGES.includes(page)) page = 'dashboard';
  const changed = ui.page !== page;
  ui.page = page;
  const applyPage = () => {
    $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
    $$('.tab').forEach(t => { const on = t.dataset.page === page; t.classList.toggle('active', on); on ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'); });
    renderCurrent();
    if (changed) window.scrollTo({ top: 0 });
  };
  applyPage();
}
function navigate(page) { if (location.hash !== '#' + page) location.hash = page; else go(page); }
function renderCurrent() {
  ({ dashboard: renderDashboard, makan: renderMeals, gym: renderGym, progres: renderProgress, pengaturan: renderSettings })[ui.page]();
  updateTabBadges();
}

function findMealEntry(id) {
  const list = state.meals[ui.mealDate] || [];
  return { list, idx: list.findIndex(e => e.id === id) };
}
function removeMealEntry(id) {
  const { list, idx } = findMealEntry(id);
  if (idx < 0) return;
  const [removed] = list.splice(idx, 1);
  const date = ui.mealDate;
  if (!list.length) delete state.meals[date];
  save(); renderCurrent();
  toast(`${esc(removed.name)} dihapus`, '', { label: 'Batalkan', fn: () => {
    (state.meals[date] = state.meals[date] || []).splice(idx, 0, removed); save(); renderCurrent();
  } });
}
function applyTemplateTo(date) {
  const entries = [];
  MEAL_SLOTS.forEach(sl => (state.template[sl.id] || []).forEach(t => {
    const f = findFood(t.foodId);
    if (f) entries.push(makeMealEntry(f, sl.id, t.qty));
  }));
  state.meals[date] = entries;
  save();
  const t = dayTotals(date);
  toast(`⚡ Menu diterapkan: ${fmtNum(t.protein, 1)} g protein · ${fmtRp(t.cost)}`, 'ok');
}

  creatineProtocol: el => {
    haptic(12);
    const mode = el.dataset.value;
    state.settings.creatineMode = mode;
    if (mode === 'loading') state.settings.creatineTarget = 20;
    else if (mode === 'weight') state.settings.creatineTarget = Math.max(3, round1((state.settings.weight || 56) * 0.05));
    else state.settings.creatineTarget = 5;
    save();
    renderCurrent();
    toast(`⚡ Protokol Creatine: ${mode === 'loading' ? 'Loading 20 g/hari (4×5g)' : `${state.settings.creatineTarget} g/hari`}`, 'ok');
  },
  creatineDoseSlot: el => {
    haptic(14);
    const date = el.dataset.date || todayStr();
    const slotId = el.dataset.slot;
    const doseG = num(el.dataset.grams, 5);
    const cur = getCreatine(date);
    const slots = [...cur.slots];
    const idx = slots.indexOf(slotId);
    let nextGrams;
    if (idx >= 0) {
      slots.splice(idx, 1);
      nextGrams = Math.max(0, round1(cur.grams - doseG));
    } else {
      slots.push(slotId);
      nextGrams = round1(cur.grams + doseG);
    }
    setCreatine(date, { grams: nextGrams, slots });
    save();
    renderCurrent();
    toast(idx >= 0 ? `Dosis dibatalkan (${fmtNum(nextGrams, 1)} g)` : `⚡ +${doseG} g tercatat (${fmtNum(nextGrams, 1)} / ${state.settings.creatineTarget || 20} g)`, idx >= 0 ? '' : 'ok');
  },
  creatineQuick: el => {
    haptic(18);
    const date = el.dataset.date || todayStr();
    const scoop = num(el.dataset.grams, state.settings.creatineTarget || 5);
    const target = state.settings.creatineTarget || 5;
    const cur = getCreatine(date);
    const nextGrams = cur.grams >= target ? round1(cur.grams + scoop) : Math.max(scoop, round1(cur.grams + scoop));
    setCreatine(date, { grams: nextGrams });
    save();
    renderCurrent();
    toast(`⚡ Creatine ${fmtNum(nextGrams, 1)} g tercatat (${fmtDateShort(date)})`, 'ok');
  },
  creatineStep: el => {
    haptic(10);
    const date = el.dataset.date || todayStr();
    const cur = getCreatine(date);
    const next = Math.max(0, round1(cur.grams + num(el.dataset.d, 1)));
    setCreatine(date, { grams: next });
    save();
    renderCurrent();
    if (next >= (state.settings.creatineTarget || 5) && cur.grams < (state.settings.creatineTarget || 5)) {
      toast(`⚡ Target creatine ${state.settings.creatineTarget || 5} g tercapai!`, 'ok');
    }
  },
  creatineReset: el => {
    haptic(12);
    const date = el.dataset.date || todayStr();
    const prev = getCreatine(date);
    setCreatine(date, { grams: 0, slots: [] });
    save();
    renderCurrent();
    toast('Creatine direset', '', { label: 'Batalkan', fn: () => { setCreatine(date, prev); save(); renderCurrent(); } });
  },
  creatineTiming: el => {
    haptic(8);
    const date = el.dataset.date || todayStr();
    setCreatine(date, { timing: el.dataset.timing });
    save();
    renderCurrent();
  },
  creatineMix: el => {
    haptic(8);
    const date = el.dataset.date || todayStr();
    setCreatine(date, { mix: el.dataset.mix });
    save();
    renderCurrent();
  },
  creatineDayTap: el => {
    haptic(12);
    const d = el.dataset.date;
    if (!d) return;
    const target = state.settings.creatineTarget || 5;
    const cur = getCreatine(d);
    const next = cur.grams >= target ? 0 : target;
    setCreatine(d, { grams: next });
    save();
    renderCurrent();
    toast(next > 0 ? `⚡ ${fmtDateShort(d)}: ${next} g creatine ✓` : `${fmtDateShort(d)}: Creatine dikosongkan`, next > 0 ? 'ok' : '');
  },
  waterStep: el => {
    haptic(10);
    const date = el.dataset.date || todayStr();
    const cur = getCreatine(date);
    const next = Math.max(0, cur.water + Math.round(num(el.dataset.d, 1)));

    renderCurrent();

  goWeight: () => { navigate('progres'); setTimeout(() => { const i = $('#weightInput'); if (i) { i.scrollIntoView({ behavior: 'smooth', block: 'center' }); i.focus({ preventScroll: true }); } }, 120); },
  applyTemplateToday: () => { applyTemplateTo(todayStr()); renderCurrent(); },

  // Makan
  mealTab: el => { ui.mealTab = el.dataset.value; renderMeals(); },
  openAddFood: el => openAddFood(el.dataset.slot),
  addFood: el => {
    haptic(12);
    const f = findFood(el.dataset.id); if (!f) return;
    const list = (state.meals[ui.mealDate] = state.meals[ui.mealDate] || []);
    const existing = list.find(e => e.foodId === f.id && e.slot === ui.addSlot && !e.sample);
    if (existing) existing.qty = round1(existing.qty + 1); else list.push(makeMealEntry(f, ui.addSlot, 1));
    save(); renderCurrent();
    const searchEl = $('#foodSearchInput');
    if (searchEl && $('#foodPickList')) $('#foodPickList').innerHTML = foodPickHtml(searchEl.value);
    toast(`✓ ${esc(f.name)} ditambahkan`, 'ok');
  },
  quickAddFood: el => {
    haptic(12);
    const f = findFood(el.dataset.id); if (!f) return;
    const date = el.dataset.date || ui.mealDate || todayStr();
    const slot = el.dataset.slot || 'pagi';
    const qty = Math.max(0.5, round1(num(el.dataset.qty, 1)));
    const list = (state.meals[date] = state.meals[date] || []);
    const existing = list.find(e => e.foodId === f.id && e.slot === slot && !e.sample);
    let addedEntry = null;
    if (existing) {
      existing.qty = round1(existing.qty + qty);
    } else {
      addedEntry = makeMealEntry(f, slot, qty);
      list.push(addedEntry);
    }
    save(); renderCurrent();
    toast(`⚡ +${fmtNum(qty, 1)}× ${esc(f.name)} (+${fmtNum(f.protein * qty, 1)}g prot)`, 'ok', {
      label: 'Batalkan',
      fn: () => {
        const curList = state.meals[date] || [];
        if (addedEntry) {
          const idx = curList.findIndex(x => x.id === addedEntry.id);
          if (idx >= 0) curList.splice(idx, 1);
        } else if (existing) {
          existing.qty = round1(existing.qty - qty);
          if (existing.qty <= 0) {
            const idx = curList.findIndex(x => x.id === existing.id);
            if (idx >= 0) curList.splice(idx, 1);
          }
        }
        if (!curList.length) delete state.meals[date];
        save(); renderCurrent();
      }
    });
  },
  qtyStep: el => {
    haptic(8);
    const { list, idx } = findMealEntry(el.dataset.id); if (idx < 0) return;
    const q = round1(list[idx].qty + Number(el.dataset.d));
    if (q <= 0) return removeMealEntry(el.dataset.id);
    list[idx].qty = q; save(); renderCurrent();
  },
  delEntry: el => removeMealEntry(el.dataset.id),
  applyTemplate: async () => {
    const date = ui.mealDate;
    if (hasMeals(date) && !(await confirmDialog('Catatan pada tanggal ini akan diganti dengan "Menu Harian Saya". Lanjutkan?', { ok: 'Ganti' }))) return;
    applyTemplateTo(date); renderCurrent();
  },
  copyYesterday: async () => {
    const date = ui.mealDate, src = state.meals[addDays(date, -1)] || [];
    if (!src.length) return toast('Tidak ada catatan pada hari sebelumnya', 'warn');
    if (hasMeals(date) && !(await confirmDialog('Ganti catatan hari ini dengan salinan hari sebelumnya?', { ok: 'Ganti' }))) return;
    state.meals[date] = src.map(e => { const c = { ...e, id: uid() }; delete c.sample; return c; });
    save(); renderCurrent(); toast('📋 Catatan kemarin disalin', 'ok');
  },
  saveTemplate: async () => {
    const list = state.meals[ui.mealDate] || [];
    if (!list.length) return toast('Catat makanan dulu sebelum menjadikannya template', 'warn');
    if (!(await confirmDialog('Jadikan menu tanggal ini sebagai "Menu Harian Saya"?', { ok: 'Simpan template' }))) return;
    const tpl = { pagi: [], sore: [], malam: [] };
    list.forEach(e => { if (findFood(e.foodId) && tpl[e.slot]) {
      const ex = tpl[e.slot].find(t => t.foodId === e.foodId);
      if (ex) ex.qty += e.qty; else tpl[e.slot].push({ foodId: e.foodId, qty: e.qty });
    } });
    state.template = tpl; save(); toast('💾 Template diperbarui', 'ok');

  openFoodForm: el => openFoodForm(el.dataset.id, !!el.dataset.fromAdd),
  backToAdd: () => openAddFood(ui.addSlot),

    state.foods = state.foods.filter(x => x.id !== f.id);
    MEAL_SLOTS.forEach(sl => { state.template[sl.id] = (state.template[sl.id] || []).filter(t => t.foodId !== f.id); });
    save(); renderCurrent(); toast('Makanan dihapus');
  },

  // Gym
  gymTab: el => { ui.gymTab = el.dataset.value; renderGym(); },
  timerStart: () => Timer.start(state.settings.restSeconds),
  timerPause: () => { haptic(10); Timer.pause(); },
  timerAdd: el => Timer.add(Number(el.dataset.sec)),
  timerStop: () => Timer.stop(),
  repStep: el => {
    haptic(8);
    const i = +el.dataset.ex, j = +el.dataset.set, d = num(el.dataset.d, 1);
    const sess = commitSession(ui.gymDate); if (!sess) return;
    const en = sess.entries[i], set = en?.sets[j];
    if (!set) return;
    const cur = (set.reps === '' || set.reps == null) ? en.repMin : num(set.reps, en.repMin);
    const next = Math.max(0, Math.round(cur + d));
    set.reps = next;
    const row = el.closest('.set-row');
    const rInput = row?.querySelector('[data-field="reps"]');
    if (rInput) rInput.value = next;
    save();
    refreshSessionProgress(sess);
  },
  addSet: el => {
    haptic(10);
    const i = +el.dataset.ex;
    const sess = commitSession(ui.gymDate); if (!sess) return;
    const en = sess.entries[i]; if (!en) return;
    const last = en.sets[en.sets.length - 1];
    en.sets.push({
      done: false,
      reps: last && last.reps !== '' ? last.reps : '',
      weight: last ? num(last.weight, en.wMin) : en.wMin
    });
    save(); renderCurrent();
    toast(`➕ Set #${en.sets.length} ditambahkan pada ${esc(en.name)}`);
  },
  removeSet: el => {
    haptic(10);
    const i = +el.dataset.ex;
    const sess = commitSession(ui.gymDate); if (!sess) return;
    const en = sess.entries[i]; if (!en || en.sets.length <= 1) return;
    en.sets.pop();
    save(); renderCurrent();
    toast(`➖ Set terakhir dihapus dari ${esc(en.name)}`);
  },
  completeAllSets: el => {
    haptic(18);
    const i = +el.dataset.ex;
    const sess = commitSession(ui.gymDate); if (!sess) return;
    const en = sess.entries[i]; if (!en) return;
    const allDone = en.sets.every(s => s.done);
    en.sets.forEach(s => {
      s.done = !allDone;
      if (s.done && (s.reps === '' || s.reps == null)) s.reps = en.repMin;
    });
    save(); renderCurrent();
    const p = sessionProgress(sess);
    if (!allDone) {
      if (p.done === p.total) { Timer.stop(); toast('💪 Semua set latihan hari ini selesai! Tekan "Selesaikan sesi".', 'ok'); }
      else Timer.start(state.settings.restSeconds, `Istirahat · ${en.name}`);
    }
  },
  finishSession: () => {
    const sess = commitSession(ui.gymDate) || state.sessions[ui.gymDate]; if (!sess) return;
    sess.completed = !sess.completed;
    save(); renderCurrent();
    if (sess.completed) {
      const p = sessionProgress(sess);
      toast(`🎉 Sesi selesai! ${p.done}/${p.total} set · minggu ini ${sessionsInWeek(weekStart(todayStr()))}/${weeklySessionTarget()}`, 'ok');
      Timer.stop();
    }
  },
  editEx: el => openExerciseForm(el.dataset.wid, el.dataset.exid),
  delEx: async el => {
    const w = state.program.workouts[el.dataset.wid], e = w.exercises.find(x => x.id === el.dataset.exid);
    if (!(await confirmDialog(`Hapus latihan "${esc(e.name)}" dari ${esc(w.name)}?`, { ok: 'Hapus', danger: true }))) return;
    w.exercises = w.exercises.filter(x => x.id !== e.id); ui.draft = null; save(); renderCurrent();
  },
  moveEx: el => {
    const list = state.program.workouts[el.dataset.wid].exercises, i = +el.dataset.idx, j = i + Number(el.dataset.dir);
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]]; ui.draft = null; save(); renderCurrent();
  },
  editWorkout: el => openWorkoutForm(el.dataset.wid),
  delWorkout: async el => {
    const wid = el.dataset.wid, w = state.program.workouts[wid];
    if (!(await confirmDialog(`Hapus hari latihan "${esc(w.name)}"? Jadwal yang memakainya akan menjadi istirahat. Riwayat sesi tetap tersimpan.`, { ok: 'Hapus', danger: true }))) return;
    delete state.program.workouts[wid];
    Object.keys(state.program.schedule).forEach(d => { if (state.program.schedule[d] === wid) state.program.schedule[d] = 'rest'; });
    ui.draft = null; save(); renderCurrent();
  },

  // Progres
  chartRange: el => { ui.chartRange = Number(el.dataset.value); renderProgress(); },
  delLog: async el => {
    if (!(await confirmDialog('Hapus catatan berat badan ini?', { ok: 'Hapus', danger: true }))) return;
    state.bodyLogs = state.bodyLogs.filter(l => l.id !== el.dataset.id); save(); renderProgress();
  },

  // Pengaturan
  setTheme: el => { state.settings.theme = el.dataset.value; save(); applyTheme(); renderSettings(); },
  exportData: () => {
    try {
      const blob = new Blob([JSON.stringify({ app: 'OtotKu', exportedAt: new Date().toISOString(), ...state }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ototku-backup-${todayStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('⬇️ Data diekspor', 'ok');
    } catch (err) { console.error(err); toast('Gagal mengekspor data', 'bad'); }
  },
  importData: () => $('#importFile').click(),
  clearSample: async () => {
    if (!(await confirmDialog('Hapus semua data contoh? Data yang Anda masukkan sendiri tetap aman.', { ok: 'Hapus data contoh', danger: true }))) return;
    removeSampleData(); renderCurrent(); toast('🧹 Data contoh dihapus', 'ok');
  },
  loadSample: () => { generateSampleData(); save(); renderCurrent(); toast('✨ Data contoh dimuat', 'ok'); },
  resetAll: async () => {
    if (!(await confirmDialog('Semua data (makan, gym, berat, pengaturan) akan dihapus permanen. Export dulu jika perlu. Lanjutkan?', { ok: 'Reset semua', danger: true }))) return;
    const theme = state.settings.theme;
    state = createDefaultState(); state.settings.theme = theme;
    ui.draft = null; ui.gymOverride = {};
    save(); applyTheme(); renderCurrent(); toast('Data direset');
  },
};

const changes = {
  dateSet: el => { if (el.value) { ui[el.dataset.scope + 'Date'] = el.value; renderCurrent(); } },
  creatineSet: el => {
    const date = el.dataset.date || todayStr();
    const v = Math.max(0, round1(num(el.value, 0)));
    setCreatine(date, { grams: v });
    save();
    renderCurrent();
  },
  qtySet: el => {
    const v = round1(num(el.value));
    if (v <= 0) return removeMealEntry(el.dataset.id);
    const { list, idx } = findMealEntry(el.dataset.id); if (idx < 0) return;
    list[idx].qty = v; save(); renderCurrent();
  },
  gymWorkout: async el => {
    const date = ui.gymDate, val = el.value, existing = state.sessions[date];
    if (existing) {
      const hasData = existing.entries.some(e => e.sets.some(s => s.done));
      if (hasData && !(await confirmDialog('Sesi ini sudah berisi data. Mengganti latihan akan menghapus data sesi tanggal ini. Lanjutkan?', { ok: 'Ganti', danger: true }))) { renderGym(); return; }
      delete state.sessions[date]; save();
    }
    ui.gymOverride[date] = val; ui.draft = null; renderCurrent();
  },
  restQuick: el => { state.settings.restSeconds = Number(el.value); save(); toast(`⏱ Timer istirahat: ${el.value} detik`); },
  toggleSet: el => {
    haptic(16);
    const i = +el.dataset.ex, j = +el.dataset.set;
    const sess = commitSession(ui.gymDate); if (!sess) return;
    const en = sess.entries[i], set = en.sets[j], row = el.closest('.set-row');
    set.done = el.checked;
    const w = row.querySelector('[data-field="weight"]'); if (w) set.weight = num(w.value);
    if (set.done && (set.reps === '' || set.reps == null)) {
      set.reps = en.repMin;
      const r = row.querySelector('[data-field="reps"]'); if (r) r.value = set.reps;
    }
    row.classList.toggle('done', set.done);
    save();
    const p = refreshSessionProgress(sess);
    updateTabBadges();
    if (set.done) {
      if (p.done === p.total) { Timer.stop(); toast('💪 Semua set selesai! Tekan "Selesaikan sesi".', 'ok'); }
      else Timer.start(state.settings.restSeconds, `Istirahat · ${en.name} (Set ${j + 1}/${en.sets.length})`);
    }
  },
  setField: el => {
    const sess = commitSession(ui.gymDate); if (!sess) return;
    const set = sess.entries[+el.dataset.ex].sets[+el.dataset.set];
    set[el.dataset.field] = el.dataset.field === 'weight' ? num(el.value) : (el.value === '' ? '' : Math.max(0, Math.round(num(el.value))));
    save();
    refreshSessionProgress(sess);
  },
  exNote: el => { const sess = commitSession(ui.gymDate); if (sess) { sess.entries[+el.dataset.ex].note = el.value.trim(); save(); } },
  sessionNote: el => { const sess = commitSession(ui.gymDate); if (sess) { sess.notes = el.value.trim(); save(); } },
  schedule: el => { state.program.schedule[el.dataset.day] = el.value; ui.draft = null; save(); renderCurrent(); toast('📅 Jadwal diperbarui'); },
  chartExercise: el => { ui.chartExercise = el.value; drawMaxChart(); },
};

const inputs = {
  foodSearch: el => { $('#foodPickList').innerHTML = foodPickHtml(el.value); },
  weightRecalc: el => {
    const w = num(el.value), s = state.settings;
    if (w < 20) return;
    $('#setPMin').value = Math.round(w * s.proteinFactorMin);
    $('#setPMax').value = Math.round(w * s.proteinFactorMax);
    $('#setPTarget').value = Math.round(w * s.proteinFactorIdeal);
  },
};

const forms = {
  food: f => {
    const d = formData(f), name = (d.name || '').trim();
    if (!name) return toast('Nama makanan wajib diisi', 'warn');
    const food = { id: d.id || 'f_' + uid(), name, portion: (d.portion || '1 porsi').trim(),
      protein: num(d.protein), kcal: num(d.kcal), satFat: num(d.satFat), priceMin: num(d.priceMin), priceMax: num(d.priceMax) };
    const idx = state.foods.findIndex(x => x.id === food.id);
    if (idx >= 0) state.foods[idx] = { ...state.foods[idx], ...food }; else state.foods.push(food);
    save(); toast(`✓ ${esc(name)} disimpan`, 'ok');
    renderMeals();
    if (ui.foodFormFromAdd) openAddFood(ui.addSlot); else closeModal();
  },
  exercise: f => {
    const d = formData(f), w = state.program.workouts[d.wid];
    const name = (d.name || '').trim();
    if (!name) return toast('Nama latihan wajib diisi', 'warn');
    const repMin = Math.max(1, Math.round(num(d.repMin, 1))), wMin = num(d.wMin);
    const e = {
      id: d.exid || uid(), name, sets: Math.min(10, Math.max(1, Math.round(num(d.sets, 3)))),
      repMin, repMax: Math.max(repMin, Math.round(num(d.repMax, repMin))), unit: d.unit === 'detik' ? 'detik' : 'rep',
      perSide: d.perSide || '', wMin, wMax: Math.max(wMin, num(d.wMax)),
      target: (d.target || '').trim(), media: (d.media || '').trim(), video: (d.video || '').trim(),
      cues: (d.cues || '').trim(), mistakes: (d.mistakes || '').trim()
    };
    const idx = w.exercises.findIndex(x => x.id === e.id);
    if (idx >= 0) w.exercises[idx] = e; else w.exercises.push(e);
    ui.draft = null; save(); closeModal(); renderGym(); toast('✓ Latihan disimpan', 'ok');
  },
  workout: f => {
    const d = formData(f), name = (d.name || '').trim();
    if (!name) return toast('Nama wajib diisi', 'warn');
    if (d.wid) Object.assign(state.program.workouts[d.wid], { name, focus: (d.focus || '').trim() });
    else state.program.workouts['w_' + uid()] = { name, focus: (d.focus || '').trim(), exercises: [] };
    ui.draft = null; save(); closeModal(); renderGym(); toast('✓ Disimpan', 'ok');
  },
  bodyLog: f => {
    const d = formData(f), w = num(d.weight, NaN);
    if (!(w >= 20 && w <= 300)) return toast('Masukkan berat badan yang valid', 'warn');
    const opt = v => (v === '' || v == null) ? null : num(v);
    const log = { id: uid(), date: d.date || todayStr(), weight: round1(w), arm: opt(d.arm), chest: opt(d.chest), thigh: opt(d.thigh) };
    const idx = state.bodyLogs.findIndex(l => l.date === log.date);
    if (idx >= 0) state.bodyLogs[idx] = log; else state.bodyLogs.push(log);
    const latest = sortedLogs().pop();
    toast('⚖️ Berat badan tersimpan', 'ok');
    if (latest.id === log.id && log.weight !== state.settings.weight) applyWeight(log.weight, true);
    save(); renderProgress();
  },
  settings: f => {
    const d = formData(f), s = state.settings;
    const pMin = num(d.proteinMin), pT = num(d.proteinTarget), pMax = num(d.proteinMax);
    if (num(d.weight) < 20) return toast('Berat badan tidak valid', 'warn');
    if (!(pMin > 0 && pMin <= pT && pT <= pMax)) return toast('Pastikan protein min ≤ ideal ≤ maks', 'warn');
    const dbs = [...new Set(String(d.dumbbells).split(/[,;\s]+/).map(Number).filter(n => n > 0))].sort((a, b) => a - b);
    if (!dbs.length) return toast('Masukkan minimal satu ukuran dumbbell', 'warn');
    Object.assign(s, {
      weight: round1(num(d.weight)), goal: (d.goal || '').trim() || DEFAULT_SETTINGS.goal,
      proteinMin: Math.round(pMin), proteinTarget: Math.round(pT), proteinMax: Math.round(pMax),
      calorieTarget: Math.max(0, Math.round(num(d.calorieTarget))), satFatLimit: Math.max(0, num(d.satFatLimit)),
      creatineTarget: Math.max(1, round1(num(d.creatineTarget, 5))),
      waterTarget: Math.max(1, Math.round(num(d.waterTarget, 10))),
      budget: Math.max(0, Math.round(num(d.budget))), restSeconds: Math.max(5, Math.round(num(d.restSeconds, 90))), dumbbells: dbs,
    });
    ui.draft = null;
    if (save()) toast('✓ Pengaturan profil disimpan', 'ok');
    renderSettings();
  },
  cloudSettings: f => {
    const d = formData(f);
    const c = state.settings.cloud = state.settings.cloud || {};
    c.provider = c.provider || 'builtin';
    c.syncKey = (d.syncKey || '').trim() || DEFAULT_SYNC_KEY;
    c.objectId = c.objectId || BUILTIN_CLOUD_OBJECT_ID;
    c.supabaseUrl = (d.supabaseUrl || '').trim();
    c.supabaseKey = (d.supabaseKey || '').trim();
    c.firebaseConfig = (d.firebaseConfig || '').trim();
    c.enabled = !!f.querySelector('input[name="cloudEnabled"]')?.checked;
    c.autoSync = true;
    save();
    Cloud.setupClient();
    toast('☁️ Konfigurasi Cloud disimpan!', 'ok');
    if (c.enabled) {
      Cloud.push({ manual: true });
    }
    renderSettings();
  }
};

function handleImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch (err) { return toast('File bukan JSON yang valid', 'bad'); }
    if (!data || typeof data !== 'object' || !data.settings || !Array.isArray(data.foods)) return toast('Format data tidak dikenali', 'bad');
    if (!(await confirmDialog('Data saat ini akan diganti dengan isi file. Lanjutkan impor?', { ok: 'Impor' }))) return;
    delete data.app; delete data.exportedAt;
    state = normalizeState(data);
    ui.draft = null; ui.gymOverride = {};
    save(); applyTheme(); renderCurrent(); toast('⬆️ Data berhasil diimpor', 'ok');
  };
  reader.onerror = () => toast('Gagal membaca file', 'bad');
  reader.readAsText(file);
}

function bindEvents() {
  document.addEventListener('click', e => {
    if (e.target.matches('.date-display input[type="date"]')) { try { e.target.showPicker(); } catch (err) { } }
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-change]');
    if (el && changes[el.dataset.change]) changes[el.dataset.change](el, e);
  });
  document.addEventListener('input', e => {
    const el = e.target.closest('[data-input]');
    if (el && inputs[el.dataset.input]) inputs[el.dataset.input](el, e);
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    if (forms[f.dataset.form]) forms[f.dataset.form](f);
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
  $('#importFile').addEventListener('change', e => { handleImport(e.target.files[0]); e.target.value = ''; });
  window.addEventListener('hashchange', () => go(location.hash.slice(1)));
  if (darkQuery) {
    const onScheme = () => { if (state.settings.theme === 'auto') { applyTheme(); renderCurrent(); } };
    darkQuery.addEventListener ? darkQuery.addEventListener('change', onScheme) : darkQuery.addListener(onScheme);
  }

  // Mobile gesture: swipe-down pada modal bottom-sheet untuk menutup & swipe kiri/kanan pada navigasi tanggal
  let touchStartX = 0, touchStartY = 0, touchModal = false, touchDateNav = null;
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    const modalDialog = e.target.closest('.modal');
    const modalBody = $('#modalBody');
    touchModal = !!(modalDialog && (!modalBody || modalBody.scrollTop <= 0) && (e.target.closest('.modal-handle') || e.target.closest('.modal-head')));
    touchDateNav = e.target.closest('.date-nav');
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (touchModal && dy > 70 && Math.abs(dy) > Math.abs(dx) * 1.5) {
      haptic(10);
      closeModal();
    } else if (touchDateNav && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.8) {
      const scope = touchDateNav.dataset.scope;
      if (scope) {
        haptic(8);
        const k = scope + 'Date';
        ui[k] = addDays(ui[k], dx < 0 ? 1 : -1);
        renderCurrent();
      }
    }
    touchModal = false;
    touchDateNav = null;
  }, { passive: true });
}

function init() {
  const saved = Store.load();
  if (saved) {
    state = normalizeState(saved);
  } else {
    state = createDefaultState();
    generateSampleData();
    state.updatedAt = null;
    state._dirty = false;
    Store.saveLocal();
  }

  // Dukungan parameter URL ?key=... dari QR Code agar otomatis menyamakan Kunci Sinkronisasi di HP
  try {
    const params = new URLSearchParams(location.search);
    const urlKey = (params.get('key') || params.get('sync') || '').trim();
    if (urlKey && state.settings?.cloud) {
      state.settings.cloud.syncKey = urlKey;
      state.settings.cloud.enabled = true;
      Store.saveLocal();
    }
  } catch (e) {}

  applyTheme();
  bindEvents();
  Cloud.init();
  go(location.hash.slice(1) || 'dashboard');

  // Registrasi Service Worker untuk PWA & Caching Offline
  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.warn('PWA ServiceWorker error:', err);
      });
    });
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
